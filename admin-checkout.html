<!DOCTYPE html>
<html lang="ht" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet Zone - Admin Peman</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#05070a',
                            card: '#0d1117',
                            border: '#1e293b',
                            emerald: '#10b981'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #05070a; color: #f1f5f9; }
        .glass-panel { background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(16, 185, 129, 0.2); }
        .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">

    <!-- NAVBAR -->
    <nav class="w-full px-4 sm:px-6 py-3 flex justify-between items-center border-b border-brand-border glass-panel sticky top-0 z-40">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-sm">
                <i class="fa-solid fa-crown"></i>
            </div>
            <span class="font-extrabold text-base sm:text-lg text-white tracking-wide">BET<span class="text-emerald-400">ZONE</span></span>
        </div>

        <div class="flex items-center gap-2">
            <span class="px-2.5 py-1 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-[10px] font-bold uppercase tracking-wider mono">
                Mòd Admin
            </span>
            <a href="dashboard.html" class="px-3 py-1.5 rounded-xl bg-brand-card border border-brand-border text-gray-300 hover:text-white transition text-xs font-bold flex items-center gap-1.5">
                <i class="fa-solid fa-house"></i>
                <span class="hidden sm:inline">Dashboard</span>
            </a>
        </div>
    </nav>

    <!-- KONTENI PRENSIPAL ADMIN -->
    <main class="flex-grow max-w-3xl w-full mx-auto px-4 py-8">
        
        <div class="mb-6 flex justify-between items-end">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white mb-1">Peman ki Annatant</h1>
                <p class="text-xs sm:text-sm text-gray-400">Verifye prèv peman yo epi aktive abònman itilizatè yo.</p>
            </div>
            <button onclick="loadAdminData()" class="px-3 py-1.5 rounded-xl bg-brand-card border border-brand-border text-gray-400 hover:text-white text-xs font-bold transition flex items-center gap-1.5">
                <i class="fa-solid fa-rotate-right"></i>
                <span class="hidden sm:inline">Rachaje</span>
            </button>
        </div>

        <!-- STATISTIK MINIMALIST ANWO A -->
        <div class="grid grid-cols-3 gap-2 sm:gap-3 mb-8">
            <div class="p-3 rounded-2xl bg-brand-card border border-brand-border flex flex-col justify-center">
                <span class="text-[10px] font-bold text-gray-500 uppercase tracking-wider mono">Annatant</span>
                <span id="pendingCount" class="text-lg sm:text-xl font-black text-amber-400 mono mt-0.5">0</span>
            </div>
            <div class="p-3 rounded-2xl bg-brand-card border border-brand-border flex flex-col justify-center">
                <span class="text-[10px] font-bold text-gray-500 uppercase tracking-wider mono">Apwouve Total</span>
                <span id="approvedCount" class="text-lg sm:text-xl font-black text-emerald-400 mono mt-0.5">0</span>
            </div>
            <div class="p-3 rounded-2xl bg-brand-card border border-brand-border flex flex-col justify-center">
                <span class="text-[10px] font-bold text-gray-500 uppercase tracking-wider mono">Total Rantre</span>
                <span id="totalAmount" class="text-lg sm:text-xl font-black text-white mono mt-0.5">0 <span class="text-xs text-gray-400 font-normal">HTG</span></span>
            </div>
        </div>

        <div class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-4 mono">// SOUMISYON POU VERIFYE</div>

        <!-- LIST SOUMISYON YO -->
        <div id="submissionsList" class="space-y-4">
            <div class="text-center py-12 text-gray-500 text-xs border border-dashed border-brand-border rounded-2xl">
                <i class="fa-solid fa-spinner fa-spin text-emerald-400 text-2xl mb-2 block"></i>
                N ap chaje peman yo nan Supabase...
            </div>
        </div>

    </main>

    <!-- POP-UP MODAL CONFIRMATION ADMIN -->
    <div id="confirmModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center z-50 px-4">
        <div class="bg-brand-card border border-brand-border max-w-sm w-full p-6 rounded-3xl text-center shadow-2xl transition-all">
            <div id="modalIconContainer" class="w-14 h-14 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4 border">
                <!-- Icon dinamik via JS -->
            </div>
            <h3 id="modalTitle" class="text-base sm:text-lg font-extrabold text-white mb-1">Konfime Aksyon</h3>
            <p id="modalDescription" class="text-xs text-gray-400 leading-relaxed mb-6">
                Èske ou sèten ou vle fè aksyon sa a?
            </p>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="closeConfirmModal()" class="py-2.5 rounded-xl bg-brand-dark border border-brand-border text-gray-300 text-xs font-bold hover:text-white transition">
                    Anule
                </button>
                <button id="modalConfirmBtn" onclick="executeStatusUpdate()" class="py-2.5 rounded-xl text-black text-xs font-extrabold transition">
                    Konfime
                </button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="py-6 text-center border-t border-brand-border text-xs text-gray-500">
        &copy; 2026 Bet Zone. Tout dwa rezève.
    </footer>

    <!-- SCRIPT LOGIK SUPABASE ADMIN -->
    <script>
        const SUPABASE_URL = 'https://uiepdartkcunumajlwwg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_OQCeY9-h1_xqOHUeMiLHcQ_uxDGmFx_';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Varib pou kenbe enfòmasyon peman anvan konfimasyon
        let selectedPaymentData = null;

        async function loadAdminData() {
            try {
                const { data: pendingPayments, error: pendingErr } = await supabaseClient
                    .from('payments')
                    .select('*')
                    .eq('status', 'pending')
                    .order('created_at', { ascending: false });

                if (pendingErr) throw pendingErr;

                const { data: approvedPayments, error: approvedErr } = await supabaseClient
                    .from('payments')
                    .select('amount')
                    .eq('status', 'approved');

                if (approvedErr) throw approvedErr;

                document.getElementById('pendingCount').innerText = pendingPayments.length;
                document.getElementById('approvedCount').innerText = approvedPayments.length;

                const totalHTG = approvedPayments.reduce((acc, curr) => acc + (Number(curr.amount) || 0), 0);
                document.getElementById('totalAmount').innerHTML = `${totalHTG.toLocaleString()} <span class="text-xs text-gray-400 font-normal">HTG</span>`;

                renderSubmissions(pendingPayments);

            } catch (err) {
                console.error("Erè Supabase:", err);
                document.getElementById('submissionsList').innerHTML = `
                    <div class="text-center py-8 text-red-400 text-xs border border-red-500/20 rounded-2xl bg-red-500/5">
                        <i class="fa-solid fa-triangle-exclamation text-xl mb-2 block"></i>
                        Erè nan chajman done yo: ${err.message}
                    </div>
                `;
            }
        }

        function renderSubmissions(payments) {
            const container = document.getElementById('submissionsList');

            if (!payments || payments.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-500 text-xs border border-dashed border-brand-border rounded-2xl">
                        <i class="fa-solid fa-circle-check text-emerald-400 text-2xl mb-2 block"></i>
                        Pa gen okenn peman annatant pou kounye a.
                    </div>
                `;
                return;
            }

            container.innerHTML = payments.map(p => {
                const dateFormatted = new Date(p.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const isVip = p.plan_selected ? p.plan_selected.toLowerCase().includes('vip') : false;

                return `
                    <div class="p-4 rounded-2xl bg-brand-card border border-brand-border flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between" id="pay-${p.id}">
                        <div class="flex items-center gap-3.5">
                            <a href="${p.proof_url}" target="_blank" title="Klike pou wè prèv la" class="w-14 h-14 rounded-xl bg-brand-dark border border-brand-border flex items-center justify-center text-emerald-400 text-xl cursor-pointer hover:border-emerald-500/50 transition shrink-0">
                                <i class="fa-solid fa-image"></i>
                            </a>
                            <div>
                                <div class="flex items-center gap-2 mb-0.5">
                                    <span class="text-sm font-bold text-white">${p.full_name || 'Itilizatè'}</span>
                                    ${p.betzone_id ? `<span class="px-1.5 py-0.5 rounded bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-[10px] font-bold mono">ID: ${p.betzone_id}</span>` : ''}
                                    <span class="text-[10px] text-gray-500 mono">${dateFormatted}</span>
                                </div>
                                <div class="text-xs text-gray-400">ID / Ref (${p.payment_method}): <b class="text-gray-200 mono">${p.account_sender}</b></div>
                                <div class="text-xs text-gray-400">Montan: <b class="text-emerald-400 mono">${p.amount} HTG</b></div>
                            </div>
                        </div>

                        <div class="flex sm:flex-col items-center sm:items-end justify-between w-full sm:w-auto gap-2 pt-2 sm:pt-0 border-t sm:border-t-0 border-brand-border">
                            <span class="px-2.5 py-0.5 rounded-md ${isVip ? 'bg-purple-500/10 border border-purple-500/30 text-purple-400' : 'bg-emerald-500/10 border border-emerald-500/30 text-emerald-400'} text-[10px] font-bold uppercase tracking-wider mono">
                                ${p.plan_selected}
                            </span>
                            <div class="flex items-center gap-2">
                                <button type="button" onclick="openConfirmModal('${p.id}', 'approved', '${p.full_name}', '${p.user_id || ''}', '${p.plan_selected}')" class="px-3 py-1.5 rounded-xl bg-emerald-500 text-black font-extrabold text-xs hover:bg-emerald-400 transition flex items-center gap-1">
                                    <i class="fa-solid fa-check"></i>
                                    <span>Apwouve</span>
                                </button>
                                <button type="button" onclick="openConfirmModal('${p.id}', 'rejected', '${p.full_name}', '${p.user_id || ''}', '${p.plan_selected}')" class="px-3 py-1.5 rounded-xl bg-brand-dark border border-brand-border text-gray-400 hover:text-red-400 hover:border-red-500/40 transition text-xs font-bold">
                                    Rejte
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // FUNKSYON POU OUVRI MODAL KONFIRMASYON AN
        function openConfirmModal(id, status, userName, userId, planSelected) {
            selectedPaymentData = { id, status, userName, userId, planSelected };
            
            const modal = document.getElementById('confirmModal');
            const iconContainer = document.getElementById('modalIconContainer');
            const title = document.getElementById('modalTitle');
            const desc = document.getElementById('modalDescription');
            const confirmBtn = document.getElementById('modalConfirmBtn');

            if (status === 'approved') {
                iconContainer.className = "w-14 h-14 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4 bg-emerald-500/20 border border-emerald-500/40 text-emerald-400";
                iconContainer.innerHTML = `<i class="fa-solid fa-circle-check"></i>`;
                title.innerText = "Apwouve Peman";
                desc.innerHTML = `Ou pral valide peman pou <b class="text-white">${userName}</b> epi aktive plan <b class="text-emerald-400">${planSelected}</b> an.`;
                confirmBtn.className = "py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-black text-xs font-extrabold transition shadow-lg shadow-emerald-500/10";
                confirmBtn.innerText = "Wi, Apwouve";
            } else {
                iconContainer.className = "w-14 h-14 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4 bg-red-500/20 border border-red-500/40 text-red-400";
                iconContainer.innerHTML = `<i class="fa-solid fa-circle-xmark"></i>`;
                title.innerText = "Rejte Peman";
                desc.innerHTML = `Èske ou sèten ou vle rejte demann peman <b class="text-white">${userName}</b> an?`;
                confirmBtn.className = "py-2.5 rounded-xl bg-red-500 hover:bg-red-400 text-white text-xs font-extrabold transition shadow-lg shadow-red-500/10";
                confirmBtn.innerText = "Wi, Rejte";
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeConfirmModal() {
            const modal = document.getElementById('confirmModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
            selectedPaymentData = null;
        }

        // LOGIK POU EKZEKITE MIZAJOU NAN SUPABASE
        async function executeStatusUpdate() {
            if (!selectedPaymentData) return;

            const { id, status, userName, userId, planSelected } = selectedPaymentData;
            const confirmBtn = document.getElementById('modalConfirmBtn');
            confirmBtn.innerText = "N ap trete...";
            confirmBtn.disabled = true;

            try {
                // 1. Update status nan tab 'payments'
                const { error: payErr } = await supabaseClient
                    .from('payments')
                    .update({ status: status })
                    .eq('id', id);

                if (payErr) throw payErr;

                // 2. Si peman an apwouve, mete ajou profil la dirèkteman
                if (status === 'approved') {
                    const cleanPlan = (planSelected || '').toLowerCase().trim();
                    const isVip = cleanPlan.includes('vip');
                    const targetPlan = isVip ? 'vip' : 'elite';
                    const daysToAdd = isVip ? 90 : 30;
                    
                    const expiryDate = new Date();
                    expiryDate.setDate(expiryDate.getDate() + daysToAdd);

                    if (userId && userId !== 'null' && userId !== 'undefined' && userId.trim() !== '') {
                        const { error: profileErr } = await supabaseClient
                            .from('profiles')
                            .update({ 
                                plan: targetPlan,
                                plan_expires_at: expiryDate.toISOString()
                            })
                            .eq('id', userId);

                        if (profileErr) console.warn("Erè update profile ak ID:", profileErr.message);
                    } else {
                        const { error: profileErr } = await supabaseClient
                            .from('profiles')
                            .update({
                                plan: targetPlan,
                                plan_expires_at: expiryDate.toISOString()
                            })
                            .eq('full_name', userName);

                        if (profileErr) console.warn("Erè update profile pa non:", profileErr.message);
                    }
                }

                closeConfirmModal();
                loadAdminData();

            } catch (err) {
                alert("Erè nan mizajou status la: " + err.message);
                confirmBtn.disabled = false;
            }
        }

        loadAdminData();
    </script>

</body>
</html>
