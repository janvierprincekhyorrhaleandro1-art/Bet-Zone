<!DOCTYPE html>
<html lang="ht" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet Zone - Istorik</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#05070a',
                            card: '#0d1117',
                            border: '#1e293b',
                            emerald: '#10b981'
                        }
                    },
                    keyframes: {
                        navZoom: {
                            '0%': { transform: 'scale(1)' },
                            '50%': { transform: 'scale(1.15)' },
                            '100%': { transform: 'scale(1)' }
                        }
                    },
                    animation: {
                        'nav-zoom': 'navZoom 0.25s ease-in-out'
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #05070a; color: #f1f5f9; }
        .glass-panel { background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(16, 185, 129, 0.2); }
        .glass-nav { background: rgba(13, 17, 23, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .mono { font-family: 'JetBrains Mono', monospace; }

        .glass-pill {
            background: rgba(16, 185, 129, 0.22);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(16, 185, 129, 0.45);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3), inset 0 0 10px rgba(255, 255, 255, 0.2);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), width 0.35s ease, height 0.35s ease;
            top: 0;
            left: 0;
        }

        .zoom-anim {
            animation: navZoom 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased pb-28">

    <!-- NAVBAR DASHBOARD -->
    <nav class="w-full px-4 sm:px-6 py-3 flex justify-between items-center border-b border-brand-border glass-panel sticky top-0 z-40">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-sm">
                <i class="fa-solid fa-crown"></i>
            </div>
            <span class="font-extrabold text-base sm:text-lg text-white tracking-wide">BET<span class="text-emerald-400">ZONE</span></span>
        </div>

        <div class="flex items-center gap-2 sm:gap-3">
            <div id="userPlanBadge" class="flex items-center">
                <span class="px-2.5 py-1 rounded-xl bg-gray-500/10 border border-brand-border text-gray-400 text-[11px] font-bold uppercase tracking-wider">
                    ...
                </span>
            </div>

            <button id="logoutBtn" class="px-3 py-1.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 hover:bg-red-500 hover:text-white transition text-xs font-bold flex items-center gap-1.5">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span class="hidden sm:inline">Dekonekte</span>
            </button>
        </div>
    </nav>

    <!-- ==================== VIEW 2: ISTORIK ==================== -->
    <main id="viewHistorique" class="app-view flex-grow max-w-4xl w-full mx-auto px-4 py-5 space-y-4">
        <div class="p-4 rounded-2xl bg-brand-card border border-brand-border">
            <div class="grid grid-cols-3 gap-2 text-center">
                <div class="p-2 rounded-xl bg-black/40 border border-brand-border">
                    <span class="text-[9px] text-gray-400 block font-semibold">Taux de Réussite</span>
                    <span id="statSuccessRate" class="text-base font-black text-emerald-400">0%</span>
                </div>
                <div class="p-2 rounded-xl bg-black/40 border border-brand-border">
                    <span class="text-[9px] text-gray-400 block font-semibold">Match Ganye</span>
                    <span id="statMatchesWon" class="text-base font-black text-emerald-400">0</span>
                </div>
                <div class="p-2 rounded-xl bg-black/40 border border-brand-border">
                    <span class="text-[9px] text-gray-400 block font-semibold">Match Pèdi</span>
                    <span id="statMatchesLost" class="text-base font-black text-red-400">0</span>
                </div>
            </div>
        </div>

        <div id="historyListContainer" class="space-y-3">
            <div class="text-center py-10 text-gray-400 text-xs">
                <i class="fa-solid fa-circle-notch fa-spin text-emerald-400 mb-2"></i>
                <p>N ap chaje istorik match ki fini yo...</p>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="py-6 text-center border-t border-brand-border text-xs text-gray-500 mb-16">
        &copy; 2026 Bet Zone. Tout dwa rezève.
    </footer>

    <!-- BOTTOM NAV -->
    <div class="fixed bottom-4 left-0 right-0 z-50 px-4 pointer-events-none">
        <nav id="bottomNav" class="relative max-w-xs mx-auto glass-nav border border-emerald-500/30 rounded-full p-1.5 flex justify-between items-center shadow-2xl shadow-emerald-950/50 pointer-events-auto">
            <div id="liquidPill" class="glass-pill absolute rounded-full pointer-events-none z-0"></div>

            <a href="dashboard.html" id="btnNavMatchs" class="nav-item relative z-10 w-1/3 flex flex-col items-center py-1.5 gap-0.5 text-gray-400 hover:text-emerald-400 font-medium transition">
                <i class="fa-solid fa-futbol text-sm"></i>
                <span class="text-[10px]">Matchs</span>
            </a>

            <a href="historik.html" id="btnNavHistorique" class="nav-item relative z-10 w-1/3 flex flex-col items-center py-1.5 gap-0.5 text-emerald-400 font-bold transition">
                <i class="fa-solid fa-clock-rotate-left text-sm"></i>
                <span class="text-[10px]">Istorik</span>
            </a>

            <a href="profil.html" id="btnNavProfile" class="nav-item relative z-10 w-1/3 flex flex-col items-center py-1.5 gap-0.5 text-gray-400 hover:text-emerald-400 font-medium transition">
                <i class="fa-solid fa-user text-sm"></i>
                <span class="text-[10px]">Profil</span>
            </a>
        </nav>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        const SUPABASE_URL = 'https://uiepdartkcunumajlwwg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_OQCeY9-h1_xqOHUeMiLHcQ_uxDGmFx_';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function updateLiquidPill(targetEl, triggerZoom = false) {
            const pill = document.getElementById('liquidPill');
            if (!pill || !targetEl) return;

            const left = targetEl.offsetLeft;
            const top = targetEl.offsetTop;
            const width = targetEl.offsetWidth;
            const height = targetEl.offsetHeight;

            pill.style.width = `${width}px`;
            pill.style.height = `${height}px`;
            pill.style.transform = `translate3d(${left}px, ${top}px, 0)`;

            if (triggerZoom) {
                pill.classList.remove('zoom-anim');
                void pill.offsetWidth;
                pill.classList.add('zoom-anim');
            }
        }

        function setupLiquidGlass() {
            const activeBtn = document.getElementById('btnNavHistorique');
            updateLiquidPill(activeBtn, false);

            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                item.addEventListener('mouseenter', () => updateLiquidPill(item, false));
                item.addEventListener('touchstart', () => updateLiquidPill(item, false), { passive: true });
            });

            document.getElementById('bottomNav').addEventListener('mouseleave', () => {
                updateLiquidPill(activeBtn, false);
            });
        }

        async function fetchDynamicHistory() {
            const container = document.getElementById('historyListContainer');
            try {
                const { data: historyMatches, error } = await supabaseClient
                    .from('match_analysis')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const finishedMatches = (historyMatches || []).filter(m => 
                    m.data && m.data.matchInfo && 
                    m.data.matchInfo.homeScore !== null && 
                    m.data.matchInfo.homeScore !== undefined
                );

                if (finishedMatches.length === 0) {
                    container.innerHTML = `<div class="text-center py-10 text-gray-400 text-xs font-bold">Poko gen match ki fini pou afiche nan istorik la.</div>`;
                    return;
                }

                let wonCount = 0;
                let lostCount = 0;

                const html = finishedMatches.map(m => {
                    const info = m.data.matchInfo;
                    const pronostik = m.data.pronostik?.[0]?.label || 'Ganye';
                    const homeScore = parseInt(info.homeScore, 10);
                    const awayScore = parseInt(info.awayScore, 10);

                    const analysisDateStr = m.created_at ? new Date(m.created_at).toLocaleDateString('ht-HT', { day: '2-digit', month: '2-digit', year: 'numeric' }) : info.date;
                    const matchDateStr = info.date || '--/--/----';

                    let isWon = false;
                    if (pronostik.toLowerCase().includes(info.homeName.toLowerCase()) && homeScore > awayScore) isWon = true;
                    else if (pronostik.toLowerCase().includes(info.awayName.toLowerCase()) && awayScore > homeScore) isWon = true;
                    else if (pronostik.toLowerCase().includes('over 2.5') && (homeScore + awayScore) > 2) isWon = true;
                    else if (pronostik.toLowerCase().includes('over 1.5') && (homeScore + awayScore) > 1) isWon = true;
                    else isWon = (homeScore > 0 || awayScore > 0);

                    if (isWon) wonCount++; else lostCount++;

                    return `
                        <div class="p-3.5 rounded-xl bg-brand-card border border-brand-border flex flex-col gap-2">
                            <div class="flex justify-between items-center text-[10px] text-gray-400 border-b border-brand-border/50 pb-1.5">
                                <span class="font-semibold text-gray-300">${info.league || 'Football'}</span>
                                <span class="${isWon ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20' : 'text-red-400 bg-red-500/10 border-red-500/20'} font-bold px-2 py-0.5 rounded border">
                                    <i class="fa-solid ${isWon ? 'fa-circle-check' : 'fa-circle-xmark'}"></i> ${isWon ? 'GANYE' : 'PÈDI'}
                                </span>
                            </div>
                            <div class="flex justify-between items-center font-bold text-xs text-white">
                                <span class="truncate max-w-[38%]">${info.homeName}</span>
                                <span class="bg-black px-2 py-0.5 rounded text-emerald-400 font-mono border border-brand-border">${homeScore} - ${awayScore}</span>
                                <span class="truncate max-w-[38%] text-right">${info.awayName}</span>
                            </div>
                            <div class="text-[10px] text-gray-400 flex flex-wrap justify-between pt-1 gap-1 border-t border-brand-border/30 mt-1">
                                <span>Pronostik: <strong class="text-emerald-400">${pronostik}</strong></span>
                                <div class="flex gap-2 text-[9px] text-gray-500">
                                    <span>Analiz: <strong class="text-gray-300">${analysisDateStr}</strong></span>
                                    <span>Jou Match: <strong class="text-gray-300">${matchDateStr}</strong></span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML = html;

                const total = wonCount + lostCount;
                const rate = total > 0 ? Math.round((wonCount / total) * 100) : 0;
                document.getElementById('statSuccessRate').innerText = `${rate}%`;
                document.getElementById('statMatchesWon').innerText = wonCount;
                document.getElementById('statMatchesLost').innerText = lostCount;

            } catch (err) {
                console.error("Erè istorik:", err);
                container.innerHTML = `<div class="text-center py-10 text-red-400 text-xs font-bold">Erè nan chajman istorik la.</div>`;
            }
        }

        async function checkAuth() {
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            if (error || !session) { window.location.href = "auth.html"; return; }
            const user = session.user;

            try {
                const { data: profile } = await supabaseClient.from('profiles').select('plan, plan_expires_at').eq('id', user.id).maybeSingle();
                const rawPlan = profile?.plan || user.user_metadata?.plan || 'free';
                let currentPlan = rawPlan.toString().toLowerCase().trim();
                const expDateVal = profile?.plan_expires_at || user.user_metadata?.plan_expires_at;

                if (expDateVal && new Date(expDateVal) < new Date()) currentPlan = 'free';

                const planBadge = document.getElementById('userPlanBadge');
                if (currentPlan.includes('elite')) {
                    planBadge.innerHTML = `<span class="px-2.5 py-1 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-[11px] font-extrabold uppercase flex items-center gap-1"><i class="fa-solid fa-star text-[10px]"></i> ÉLITE</span>`;
                } else if (currentPlan.includes('vip')) {
                    planBadge.innerHTML = `<span class="px-2.5 py-1 rounded-xl bg-purple-500/10 border border-purple-500/30 text-purple-400 text-[11px] font-extrabold uppercase flex items-center gap-1"><i class="fa-solid fa-crown text-[10px]"></i> VIP</span>`;
                } else {
                    planBadge.innerHTML = `<span class="px-2.5 py-1 rounded-xl bg-gray-500/10 border border-brand-border text-gray-400 text-[11px] font-bold uppercase">GRATIS</span>`;
                }
            } catch (err) {}
        }

        const logoutHandler = async () => {
            await supabaseClient.auth.signOut();
            window.location.href = "auth.html";
        };
        document.getElementById('logoutBtn').addEventListener('click', logoutHandler);

        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            fetchDynamicHistory();
            setupLiquidGlass();
        });
    </script>
</body>
</html>
