<!DOCTYPE html>
<html lang="ht" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet Zone - Otantifikasyon</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#05070a',
                            card: '#0d1117',
                            border: '#1e293b',
                            emerald: '#10b981'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #05070a; color: #f1f5f9; }
        .glass-panel { background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(16, 185, 129, 0.2); }
        .emerald-glow { box-shadow: 0 0 15px rgba(16, 185, 129, 0.15); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center px-4 py-8 antialiased">

    <!-- LOGO AK KOURÒN -->
    <div class="text-center mb-6">
        <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-extrabold text-xl mx-auto mb-3 emerald-glow">
            <i class="fa-solid fa-crown"></i>
        </div>
        <h1 class="text-2xl font-extrabold tracking-wide text-white">
            BET<span class="text-emerald-400">ZONE</span>
        </h1>
        <p class="text-xs text-gray-400 mt-1">Espace Membre VIP</p>
    </div>

    <!-- KONTENÈ AUTH -->
    <div class="w-full max-w-md p-6 rounded-2xl bg-brand-card border border-brand-border emerald-glow">
        
        <!-- TI MOUTO BOUTON (KONEKTE / ENSKRI) -->
        <div class="flex p-1 mb-5 rounded-xl bg-black border border-brand-border">
            <button type="button" id="tabLoginBtn" onclick="switchTab('login')" class="w-1/2 py-2 rounded-lg text-xs font-bold bg-emerald-500 text-black transition">
                Konekte
            </button>
            <button type="button" id="tabRegisterBtn" onclick="switchTab('register')" class="w-1/2 py-2 rounded-lg text-xs font-bold text-gray-400 hover:text-white transition">
                Enskri
            </button>
        </div>

        <!-- FORMULAIRE KONEKSYON (LOGIN) -->
        <form id="loginForm" onsubmit="handleAuth(event, 'login')" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">Email</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-3 top-3 text-gray-500 text-xs"></i>
                    <input type="email" id="loginEmail" required placeholder="egzanp@gmail.com" class="w-full pl-9 pr-3 py-2.5 rounded-xl bg-black/50 border border-brand-border text-xs text-white focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-xs font-semibold text-gray-300">Modpas</label>
                    <a href="#" onclick="forgotPassword()" class="text-[10px] text-emerald-400 font-semibold hover:underline">Bliye modpas?</a>
                </div>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3 top-3 text-gray-500 text-xs"></i>
                    <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full pl-9 pr-3 py-2.5 rounded-xl bg-black/50 border border-brand-border text-xs text-white focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <button type="submit" class="w-full py-3 rounded-xl bg-emerald-500 text-black font-extrabold text-xs hover:bg-emerald-400 transition flex items-center justify-center gap-2">
                <span>Konekte</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <!-- FORMULAIRE ENSKRIPSYON (REGISTER) -->
        <form id="registerForm" onsubmit="handleAuth(event, 'register')" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">Non Konplè</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-3 top-3 text-gray-500 text-xs"></i>
                    <input type="text" id="regName" required placeholder="Non ou" class="w-full pl-9 pr-3 py-2.5 rounded-xl bg-black/50 border border-brand-border text-xs text-white focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">Email</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-3 top-3 text-gray-500 text-xs"></i>
                    <input type="email" id="regEmail" required placeholder="egzanp@gmail.com" class="w-full pl-9 pr-3 py-2.5 rounded-xl bg-black/50 border border-brand-border text-xs text-white focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">Kreyasyon Modpas</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3 top-3 text-gray-500 text-xs"></i>
                    <input type="password" id="regPassword" required placeholder="Modpas ou" class="w-full pl-9 pr-3 py-2.5 rounded-xl bg-black/50 border border-brand-border text-xs text-white focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <button type="submit" class="w-full py-3 rounded-xl bg-emerald-500 text-black font-extrabold text-xs hover:bg-emerald-400 transition flex items-center justify-center gap-2">
                <span>Kreye Kont Mwen</span>
                <i class="fa-solid fa-user-plus"></i>
            </button>
        </form>

    </div>

    <!-- SCRIPT JAVASCRIPT KORIIJE -->
    <script>
        // Setup Supabase (Se sèlman si w ranplase URL ak KEY yo l ap siyen nan yon vre baz de done)
        const SUPABASE_URL = 'https://xyzcompany.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...';
        
        let supabaseClient = null;
        if (typeof supabase !== 'undefined' && SUPABASE_URL !== 'https://xyzcompany.supabase.co') {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        // Chanje ant Konekte ak Enskri
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabLoginBtn = document.getElementById('tabLoginBtn');
            const tabRegisterBtn = document.getElementById('tabRegisterBtn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLoginBtn.className = "w-1/2 py-2 rounded-lg text-xs font-bold bg-emerald-500 text-black transition";
                tabRegisterBtn.className = "w-1/2 py-2 rounded-lg text-xs font-bold text-gray-400 hover:text-white transition";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegisterBtn.className = "w-1/2 py-2 rounded-lg text-xs font-bold bg-emerald-500 text-black transition";
                tabLoginBtn.className = "w-1/2 py-2 rounded-lg text-xs font-bold text-gray-400 hover:text-white transition";
            }
        }

        // Jere Aksyon Auth Yo (Login / Register)
        async function handleAuth(event, type) {
            event.preventDefault();

            if (supabaseClient) {
                try {
                    if (type === 'login') {
                        const email = document.getElementById('loginEmail').value;
                        const password = document.getElementById('loginPassword').value;
                        await supabaseClient.auth.signInWithPassword({ email, password });
                    } else {
                        const email = document.getElementById('regEmail').value;
                        const password = document.getElementById('regPassword').value;
                        await supabaseClient.auth.signUp({ email, password });
                    }
                } catch (err) {
                    console.log("Erè Supabase: ", err);
                }
            }

            // Redirèksyon pou tès (mache menm san sèvè)
            window.location.href = "dashboard.html";
        }

        // Fonksyon Bliye Modpas
        async function forgotPassword() {
            const email = prompt("Antre email ou pou nou voye yon lyen rekiperasyon:");
            if (email && supabaseClient) {
                await supabaseClient.auth.resetPasswordForEmail(email);
                alert("Si email sa nan baz de done a, nou voye yon mesaj rekiperasyon ba ou.");
            } else if (email) {
                alert("Mesaj rekiperasyon voye sou email ou!");
            }
        }
    </script>
</body>
</html>
