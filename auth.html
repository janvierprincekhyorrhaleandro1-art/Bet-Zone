<!DOCTYPE html>
<html lang="ht" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet Zone - Otantifikasyon</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#05070a',
                            card: '#0d1117',
                            border: '#1e293b',
                            emerald: '#10b981'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #05070a; color: #f1f5f9; }
        .emerald-glow { box-shadow: 0 0 25px rgba(16, 185, 129, 0.25); }
        .glass-panel { background: rgba(13, 17, 23, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4">

    <!-- BOUTÒN RETOUNEN NAN AKÈY -->
    <div class="w-full max-w-md pt-4 flex justify-start">
        <a href="index.html" class="text-xs text-gray-400 hover:text-emerald-400 transition flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Retounen sou paj akèy</span>
        </a>
    </div>

    <!-- BOÎTE AUTHENTIFICATION -->
    <div class="w-full max-w-md my-auto glass-panel p-8 rounded-3xl border border-brand-border emerald-glow">
        
        <!-- LOGO & TIT -->
        <div class="text-center mb-6">
            <div class="w-14 h-14 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-2xl mx-auto mb-3">
                <i class="fa-solid fa-crown"></i>
            </div>
            <h1 class="text-2xl font-black text-white tracking-wide">BET<span class="text-emerald-400">ZONE</span></h1>
            <p class="text-xs text-gray-400 mt-1" id="authSubtitle">Konekte pou w ka gen aksè ak prediksyon VIP yo</p>
        </div>

        <!-- TAB SWAP (KONEKTE / ENSKRI) -->
        <div class="flex bg-brand-dark p-1 rounded-xl border border-brand-border mb-6">
            <button id="tabLogin" class="flex-1 py-2 text-xs font-bold rounded-lg text-emerald-400 bg-brand-card border border-emerald-500/20 transition">
                Konekte
            </button>
            <button id="tabRegister" class="flex-1 py-2 text-xs font-bold text-gray-400 hover:text-white transition">
                Enskri
            </button>
        </div>

        <!-- MESAJ ERÈ OSWA SIKSÈ -->
        <div id="alertBox" class="hidden p-3 mb-4 rounded-xl text-xs text-center font-medium"></div>

        <!-- FORMULAIRE -->
        <form id="authForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1.5">Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-500 text-xs">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input type="email" id="emailInput" required placeholder="egzanp@gmail.com" class="w-full pl-10 pr-4 py-3 bg-brand-dark border border-brand-border rounded-xl text-xs text-white placeholder-gray-600 focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1.5">Modpas</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-500 text-xs">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="passwordInput" required placeholder="••••••••" class="w-full pl-10 pr-4 py-3 bg-brand-dark border border-brand-border rounded-xl text-xs text-white placeholder-gray-600 focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full py-3.5 rounded-xl bg-emerald-500 text-black text-xs font-extrabold hover:bg-emerald-400 transition flex items-center justify-center gap-2 mt-2">
                <span id="btnText">Konekte</span>
                <i class="fa-solid fa-right-to-bracket"></i>
            </button>
        </form>
    </div>

    <!-- FOOTER -->
    <footer class="py-4 text-center text-xs text-gray-600">
        &copy; 2026 Bet Zone. Tout dwa rezève.
    </footer>

    <!-- LOGIK JAVASCRIPT AK SUPABASE -->
    <script>
        // Kle Supabase ou yo
        const SUPABASE_URL = 'https://uiepdartkcunumajlwwg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_OQCeY9-h1_xqOHUeMiLHcQ_uxDGmFx_';
        
        // Inisyalizasyon Client Supabase
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // State pou moute ant "login" ak "register"
        let isLogin = true;

        const tabLogin = document.getElementById('tabLogin');
        const tabRegister = document.getElementById('tabRegister');
        const authSubtitle = document.getElementById('authSubtitle');
        const btnText = document.getElementById('btnText');
        const alertBox = document.getElementById('alertBox');
        const authForm = document.getElementById('authForm');

        // Swap nan mòd Konekte
        tabLogin.addEventListener('click', () => {
            isLogin = true;
            tabLogin.className = "flex-1 py-2 text-xs font-bold rounded-lg text-emerald-400 bg-brand-card border border-emerald-500/20 transition";
            tabRegister.className = "flex-1 py-2 text-xs font-bold text-gray-400 hover:text-white transition";
            authSubtitle.innerText = "Konekte pou w ka gen aksè ak prediksyon VIP yo";
            btnText.innerText = "Konekte";
            hideAlert();
        });

        // Swap nan mòd Enskri
        tabRegister.addEventListener('click', () => {
            isLogin = false;
            tabRegister.className = "flex-1 py-2 text-xs font-bold rounded-lg text-emerald-400 bg-brand-card border border-emerald-500/20 transition";
            tabLogin.className = "flex-1 py-2 text-xs font-bold text-gray-400 hover:text-white transition";
            authSubtitle.innerText = "Kreye yon kont VIP san pèdi tan";
            btnText.innerText = "Kreye Kont";
            hideAlert();
        });

        // Fonksyon Afichaj Mesaj Alert
        function showAlert(message, isError = true) {
            alertBox.innerText = message;
            alertBox.classList.remove('hidden', 'bg-red-500/10', 'text-red-400', 'border-red-500/20', 'bg-emerald-500/10', 'text-emerald-400', 'border-emerald-500/20');
            
            if (isError) {
                alertBox.classList.add('bg-red-500/10', 'text-red-400', 'border', 'border-red-500/20');
            } else {
                alertBox.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border', 'border-emerald-500/20');
            }
        }

        function hideAlert() {
            alertBox.classList.add('hidden');
        }

        // Soumisyon Formulaire la
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            
            submitBtn.disabled = true;
            btnText.innerText = "N ap trete...";

            if (isLogin) {
                // TANTE KONEKSYON
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    showAlert("Koneksyon echwe: " + error.message, true);
                    submitBtn.disabled = false;
                    btnText.innerText = "Konekte";
                } else {
                    showAlert("Koneksyon reyisi! N ap re-dirije w...", false);
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1000);
                }
            } else {
                // TANTE ENSKRIPSYON
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });

                if (error) {
                    showAlert("Enskripsyon echwe: " + error.message, true);
                    submitBtn.disabled = false;
                    btnText.innerText = "Kreye Kont";
                } else {
                    showAlert("Kont ou kreye ak siksè! N ap voye w sou Dashboard...", false);
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1200);
                }
            }
        });

        // Si itilizatè a deja konekte anvan, voye l dirèkteman sou dashboard.html
        async function checkExistingSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                window.location.href = "dashboard.html";
            }
        }
        checkExistingSession();
    </script>

</body>
</html>
