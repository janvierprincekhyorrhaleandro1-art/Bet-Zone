<!DOCTYPE html>
<html lang="ht" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet Zone - Changer Password</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#05070a',
                            card: '#0d1117',
                            border: '#1e293b',
                            emerald: '#10b981'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #05070a; color: #f1f5f9; }
        .glass-panel { background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(16, 185, 129, 0.2); }
        .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">

    <!-- NAVBAR -->
    <nav class="w-full px-4 sm:px-6 py-3 flex justify-between items-center border-b border-brand-border glass-panel sticky top-0 z-40">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-sm">
                <i class="fa-solid fa-key"></i>
            </div>
            <span class="font-extrabold text-base sm:text-lg text-white tracking-wide">BET<span class="text-emerald-400">ZONE</span></span>
        </div>
        <a href="index.html" class="px-3 py-1.5 rounded-xl bg-brand-card border border-brand-border text-gray-300 hover:text-white transition text-xs font-bold flex items-center gap-1.5">
            <i class="fa-solid fa-right-to-bracket"></i>
            <span>Konekte</span>
        </a>
    </nav>

    <!-- FORMULAIRE RESET PASSWORD -->
    <main class="flex-grow flex items-center justify-center px-4 py-8">
        <div class="max-w-md w-full bg-brand-card border border-brand-border p-6 sm:p-8 rounded-3xl shadow-2xl relative overflow-hidden">
            
            <div class="text-center mb-6">
                <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-xl mx-auto mb-3">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h1 class="text-xl sm:text-2xl font-black text-white">Chanje Modpas</h1>
                <p class="text-xs text-gray-400 mt-1">Antre nouvo modpas ou vle itilize pou kont ou an.</p>
            </div>

            <!-- MESAJE ERÈ OSWA SIKSÈ -->
            <div id="alertBox" class="hidden mb-4 p-3 rounded-xl text-xs border transition-all"></div>

            <form id="resetForm" onsubmit="handlePasswordReset(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-1.5 uppercase tracking-wider mono">Nouvo Modpas</label>
                    <div class="relative">
                        <input type="password" id="newPassword" required minlength="6" placeholder="Atmann 6 karaktè" class="w-full bg-brand-dark border border-brand-border rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-gray-600 focus:outline-none focus:border-emerald-500/60 transition">
                        <button type="button" onclick="togglePasswordVisibility('newPassword', 'eyeIcon1')" class="absolute right-3 top-2.5 text-gray-500 hover:text-gray-300 text-xs">
                            <i id="eyeIcon1" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-1.5 uppercase tracking-wider mono">Konfime Modpas</label>
                    <div class="relative">
                        <input type="password" id="confirmPassword" required minlength="6" placeholder="Repete nouvo modpas la" class="w-full bg-brand-dark border border-brand-border rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-gray-600 focus:outline-none focus:border-emerald-500/60 transition">
                        <button type="button" onclick="togglePasswordVisibility('confirmPassword', 'eyeIcon2')" class="absolute right-3 top-2.5 text-gray-500 hover:text-gray-300 text-xs">
                            <i id="eyeIcon2" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold text-xs transition shadow-lg shadow-emerald-500/10 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>Mete ajou Modpas</span>
                </button>
            </form>
        </div>
    </main>

    <footer class="py-6 text-center border-t border-brand-border text-xs text-gray-500">
        &copy; 2026 Bet Zone. Tout dwa rezève.
    </footer>

    <script>
        const SUPABASE_URL = 'https://uiepdartkcunumajlwwg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_OQCeY9-h1_xqOHUeMiLHcQ_uxDGmFx_';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Koute evènman re-inisyalizasyon an lè moun nan klike sou lyen imèl la
        supabaseClient.auth.onAuthStateChange(async (event, session) => {
            if (event === 'PASSWORD_RECOVERY') {
                showAlert('Mòd re-inisyalizasyon aktivé. Antre nouvo modpas ou an.', 'info');
            }
        });

        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fa-solid fa-eye';
            }
        }

        function showAlert(msg, type) {
            const box = document.getElementById('alertBox');
            box.classList.remove('hidden', 'bg-red-500/10', 'border-red-500/30', 'text-red-400', 'bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400', 'bg-blue-500/10', 'border-blue-500/30', 'text-blue-400');

            if (type === 'error') {
                box.classList.add('bg-red-500/10', 'border-red-500/30', 'text-red-400');
            } else if (type === 'success') {
                box.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400');
            } else {
                box.classList.add('bg-blue-500/10', 'border-blue-500/30', 'text-blue-400');
            }

            box.innerText = msg;
        }

        async function handlePasswordReset(e) {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');

            if (newPassword !== confirmPassword) {
                showAlert('Modpas yo pa koresponn!', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> N ap mete l ajou...`;

            try {
                const { error } = await supabaseClient.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                showAlert('Modpas ou an chanje ak siksè! N ap redireksyon w sou paj koneksyon an...', 'success');

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2500);

            } catch (err) {
                showAlert("Erè: " + err.message, 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-shield-halved"></i> <span>Mete ajou Modpas</span>`;
            }
        }
    </script>

</body>
</html>
