<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold text-center mb-6 text-emerald-400">Match Dashboard</h1>
        
        <!-- Conteneur pou afiche match yo -->
        <div id="matches-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Match yo ap vinn rantre la ak JavaScript -->
        </div>
    </div>

    <script>
        // Egzanp done match yo (Modèl sa ka soti nan API w la)
        const matchesData = [
            {
                id: 1,
                homeTeam: "Real Madrid",
                awayTeam: "Barcelona",
                homeScore: 0,
                awayScore: 0,
                status: "SCHEDULED" // Poko kòmanse -> Ap afiche VS
            },
            {
                id: 2,
                homeTeam: "Chelsea",
                awayTeam: "Arsenal",
                homeScore: 2,
                awayScore: 1,
                status: "LIVE" // Live -> Ap afiche score 2 - 1
            },
            {
                id: 3,
                homeTeam: "PSG",
                awayTeam: "Marseille",
                homeScore: 3,
                awayScore: 0,
                status: "FINISHED" // Fini -> Ap afiche score 3 - 0
            }
        ];

        function renderMatches(matches) {
            const container = document.getElementById('matches-container');
            container.innerHTML = '';

            matches.forEach(m => {
                // Tcheke si status la se yon match ki deja KÒMANSE oswa FINI
                const isStarted = ['LIVE', 'IN_PLAY', '1H', '2H', 'HT', 'FINISHED', 'FT'].includes(m.status);

                // Si l kòmanse -> Afiche Score. Si l poko kòmanse -> Afiche VS
                const scoreDisplayHtml = isStarted ? 
                    `<span class="bg-black/80 px-3 py-1 rounded text-emerald-400 font-mono text-sm border border-emerald-500/30 font-bold">${m.homeScore ?? 0} - ${m.awayScore ?? 0}</span>` : 
                    `<span class="text-xs text-gray-400 font-extrabold px-2 py-1 bg-gray-800 rounded border border-gray-700">VS</span>`;

                const matchCard = `
                    <div class="bg-gray-800 border border-gray-700 rounded-lg p-4 flex items-center justify-between shadow-lg">
                        <div class="flex-1 text-right font-semibold text-sm">${m.homeTeam}</div>
                        
                        <div class="mx-4 flex flex-col items-center">
                            ${scoreDisplayHtml}
                            <span class="text-[10px] text-gray-400 mt-1 uppercase font-semibold">${m.status}</span>
                        </div>
                        
                        <div class="flex-1 text-left font-semibold text-sm">${m.awayTeam}</div>
                    </div>
                `;

                container.innerHTML += matchCard;
            });
        }

        // Ekzekite fonksyon an lè paj la chaje
        renderMatches(matchesData);
    </script>
</body>
</html>
