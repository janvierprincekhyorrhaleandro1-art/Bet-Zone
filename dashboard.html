<!DOCTYPE html>
<html lang="ht" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet Zone - Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#05070a',
                            card: '#0d1117',
                            border: '#1e293b',
                            emerald: '#10b981'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #05070a; color: #f1f5f9; }
        .glass-panel { background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(16, 185, 129, 0.2); }
        .glass-nav { background: rgba(13, 17, 23, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <!-- Custom CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col justify-between antialiased pb-24">

    <!-- NAVBAR DASHBOARD -->
    <nav class="w-full px-4 sm:px-6 py-3 flex justify-between items-center border-b border-brand-border glass-panel sticky top-0 z-40">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-sm">
                <i class="fa-solid fa-crown"></i>
            </div>
            <span class="font-extrabold text-base sm:text-lg text-white tracking-wide">BET<span class="text-emerald-400">ZONE</span></span>
        </div>

        <div class="flex items-center gap-2 sm:gap-3">
            <div id="userPlanBadge" class="flex items-center">
                <span class="px-2.5 py-1 rounded-xl bg-gray-500/10 border border-brand-border text-gray-400 text-[11px] font-bold uppercase tracking-wider">
                    ...
                </span>
            </div>

            <button id="logoutBtn" class="px-3 py-1.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 hover:bg-red-500 hover:text-white transition text-xs font-bold flex items-center gap-1.5">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span class="hidden sm:inline">Dekonekte</span>
            </button>
        </div>
    </nav>

    <!-- KONTENI PRENSIPAL DASHBOARD -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-5">
        
        <!-- BYENVENI BANNER -->
        <div class="p-3 sm:p-4 rounded-xl bg-gradient-to-r from-emerald-950/40 via-brand-card to-brand-card border border-emerald-500/30 mb-5 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-2.5 h-8 bg-emerald-500 rounded-full hidden sm:block"></div>
                <div>
                    <h1 class="text-xs sm:text-sm font-bold text-white">
                        Benvini sou Dashboard ou, <span id="userNameDisplay" class="text-emerald-400 font-extrabold">...</span>! 👋
                    </h1>
                    <p class="text-gray-400 text-[10px] sm:text-xs">Prediksyon ak analiz spòtif an tan reyèl.</p>
                </div>
            </div>
            <div class="px-2.5 py-1 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-[10px] font-bold whitespace-nowrap flex items-center gap-1.5">
                <i class="fa-solid fa-shield-check text-xs"></i>
                <span class="hidden xs:inline">Kont Verifye</span>
            </div>
        </div>

        <!-- 2 BAND KÒT A KÒT (ONGLÈ/TABS) -->
        <div class="grid grid-cols-2 gap-3 mb-5">
            <button id="tabFreeBtn" onclick="switchCategory('free')" class="py-3 px-3 rounded-xl border font-bold text-xs flex items-center justify-center gap-2 transition shadow-md bg-emerald-500/20 border-emerald-500 text-emerald-400">
                <i class="fa-solid fa-gift text-sm"></i>
                <span class="truncate">Match gratis jounen an</span>
            </button>

            <button id="tabVipBtn" onclick="switchCategory('vip')" class="py-3 px-3 rounded-xl border font-bold text-xs flex items-center justify-center gap-2 transition shadow-md bg-brand-card border-brand-border text-gray-400 hover:text-amber-400">
                <i class="fa-solid fa-crown text-sm text-amber-400"></i>
                <span class="truncate">Match VIP / ELITE</span>
                <i id="vipTabLockIcon" class="fa-solid fa-lock text-[10px] text-amber-400 ml-0.5"></i>
            </button>
        </div>

        <!-- BAND FILTÈ KI DEFILE ANBA BOUTON YO SOU MATCH YO -->
        <div class="grid grid-cols-2 gap-3 mb-5 relative z-30">
            
            <!-- 1. BOUTON & LIS DEFILANT CHANPYONA -->
            <div class="relative">
                <span class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 flex items-center gap-1">
                    <i class="fa-solid fa-trophy text-emerald-400"></i>
                    <span>Chanpyona</span>
                </span>
                <button onclick="toggleDropdown('leagueDropdown')" class="w-full bg-brand-card border border-brand-border hover:border-emerald-500/50 text-white text-xs font-bold rounded-xl px-3 py-2.5 flex items-center justify-between transition shadow-sm">
                    <span id="selectedLeagueLabel" class="truncate text-emerald-400">Tout Chanpyona</span>
                    <i class="fa-solid fa-chevron-down text-xs text-gray-400 ml-1"></i>
                </button>

                <!-- LIS DEFILANT ABSOLUTE (SOU MATCH YO) -->
                <div id="leagueDropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-brand-card border border-emerald-500/30 rounded-xl p-2 shadow-2xl space-y-1 max-h-60 overflow-y-auto no-scrollbar z-50">
                    <button onclick="selectLeague('ALL', 'Tout Chanpyona')" class="w-full text-left px-3 py-2 rounded-lg text-xs font-bold hover:bg-emerald-500/10 hover:text-emerald-400 transition">
                        Tout Chanpyona
                    </button>
                    <button onclick="selectLeague('PL', '🏴 Premier League')" class="w-full text-left px-3 py-2 rounded-lg text-xs font-bold hover:bg-emerald-500/10 hover:text-emerald-400 transition">
                        🏴 Premier League
                    </button>
                    <button onclick="selectLeague('PD', '🇪🇸 La Liga')" class="w-full text-left px-3 py-2 rounded-lg text-xs font-bold hover:bg-emerald-500/10 hover:text-emerald-400 transition">
                        🇪🇸 La Liga
                    </button>
                    <button onclick="selectLeague('BL1', '🇩🇪 Bundesliga')" class="w-full text-left px-3 py-2 rounded-lg text-xs font-bold hover:bg-emerald-500/10 hover:text-emerald-400 transition">
                        🇩🇪 Bundesliga
                    </button>
                    <button onclick="selectLeague('FL1', '🇫🇷 Ligue 1')" class="w-full text-left px-3 py-2 rounded-lg text-xs font-bold hover:bg-emerald-500/10 hover:text-emerald-400 transition">
                        🇫🇷 Ligue 1
                    </button>
                    <button onclick="selectLeague('SA', '🇮🇹 Serie A')" class="w-full text-left px-3 py-2 rounded-lg text-xs font-bold hover:bg-emerald-500/10 hover:text-emerald-400 transition">
                        🇮🇹 Serie A
                    </button>
                    <button onclick="selectLeague('CL', '🏆 Champions League')" class="w-full text-left px-3 py-2 rounded-lg text-xs font-bold hover:bg-emerald-500/10 hover:text-emerald-400 transition">
                        🏆 Champions League
                    </button>
                </div>
            </div>

            <!-- 2. BOUTON & LIS DEFILANT DATE -->
            <div class="relative">
                <span class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 flex items-center gap-1">
                    <i class="fa-regular fa-calendar-days text-emerald-400"></i>
                    <span>Date</span>
                </span>
                <button onclick="toggleDropdown('dateDropdown')" class="w-full bg-brand-card border border-brand-border hover:border-emerald-500/50 text-white text-xs font-bold rounded-xl px-3 py-2.5 flex items-center justify-between transition shadow-sm">
                    <span id="selectedDateLabel" class="truncate text-emerald-400">Jodi a</span>
                    <i class="fa-solid fa-chevron-down text-xs text-gray-400 ml-1"></i>
                </button>

                <!-- LIS DEFILANT ABSOLUTE (SOU MATCH YO) -->
                <div id="dateDropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-brand-card border border-emerald-500/30 rounded-xl p-2 shadow-2xl space-y-1 max-h-60 overflow-y-auto no-scrollbar z-50">
                    <div id="dateModalList" class="space-y-1">
                        <!-- Dat yo ap rantre la dinamikman -->
                    </div>
                </div>
            </div>

        </div>

        <!-- GRID MATCH YO -->
        <div id="matchesContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 relative z-10">
            <div class="col-span-full text-center py-10 text-gray-400">
                <i class="fa-solid fa-circle-notch fa-spin text-xl text-emerald-400 mb-2"></i>
                <p class="text-xs font-semibold">N ap chaje match yo...</p>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="py-6 text-center border-t border-brand-border text-xs text-gray-500 mb-16">
        &copy; 2026 Bet Zone. Tout dwa rezève.
    </footer>

    <!-- BOTTOM NAV -->
    <div class="fixed bottom-4 left-0 right-0 z-50 px-4 pointer-events-none">
        <nav class="max-w-xs mx-auto glass-nav border border-emerald-500/30 rounded-full px-5 py-2 flex justify-between items-center shadow-2xl shadow-emerald-950/50 pointer-events-auto">
            <a href="dashboard.html" class="flex flex-col items-center gap-0.5 text-emerald-400 font-bold transition">
                <div class="w-8 h-8 rounded-full bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-sm shadow-sm">
                    <i class="fa-solid fa-futbol"></i>
                </div>
                <span class="text-[10px]">Matchs</span>
            </a>
            <a href="historique.html" class="flex flex-col items-center gap-0.5 text-gray-400 hover:text-emerald-400 font-medium transition">
                <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </div>
                <span class="text-[10px]">Istorik</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center gap-0.5 text-gray-400 hover:text-emerald-400 font-medium transition">
                <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm">
                    <i class="fa-solid fa-user"></i>
                </div>
                <span class="text-[10px]">Profil</span>
            </a>
        </nav>
    </div>

    <!-- SCRIPT SUPABASE AK KONTWÒL -->
    <script>
        const SUPABASE_URL = 'https://uiepdartkcunumajlwwg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_OQCeY9-h1_xqOHUeMiLHcQ_uxDGmFx_';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let loadedMatches = [];
        let currentUserPlan = 'free';
        let activeCategory = 'free'; // 'free' oswa 'vip'
        let currentDayFilter = sessionStorage.getItem('bz_selected_date') || null;
        let currentLeagueFilter = sessionStorage.getItem('bz_selected_league') || 'ALL';

        function toggleDropdown(id) {
            const el = document.getElementById(id);
            el.classList.toggle('hidden');
        }

        function switchCategory(cat) {
            activeCategory = cat;
            const freeBtn = document.getElementById('tabFreeBtn');
            const vipBtn = document.getElementById('tabVipBtn');

            if (cat === 'free') {
                freeBtn.className = "py-3 px-3 rounded-xl border font-bold text-xs flex items-center justify-center gap-2 transition shadow-md bg-emerald-500/20 border-emerald-500 text-emerald-400";
                vipBtn.className = "py-3 px-3 rounded-xl border font-bold text-xs flex items-center justify-center gap-2 transition shadow-md bg-brand-card border-brand-border text-gray-400 hover:text-amber-400";
            } else {
                vipBtn.className = "py-3 px-3 rounded-xl border font-bold text-xs flex items-center justify-center gap-2 transition shadow-md bg-amber-500/20 border-amber-500 text-amber-400";
                freeBtn.className = "py-3 px-3 rounded-xl border font-bold text-xs flex items-center justify-center gap-2 transition shadow-md bg-brand-card border-brand-border text-gray-400 hover:text-emerald-400";
            }

            applyFilters();
        }

        function renderDynamicDays() {
            const dateModalList = document.getElementById('dateModalList');
            if (!dateModalList) return;
            const daysOfWeek = ['Dimanch', 'Lendi', 'Mardi', 'Mèkredi', 'Jedi', 'Vandredi', 'Samdi'];
            const targetToday = new Date();
            let htmlContent = '';

            const savedDate = sessionStorage.getItem('bz_selected_date');
            const savedDateLabel = sessionStorage.getItem('bz_selected_date_label');

            for (let i = -1; i <= 8; i++) {
                const targetDate = new Date(targetToday);
                targetDate.setDate(targetToday.getDate() + i);
                const dayName = daysOfWeek[targetDate.getDay()];
                const dayNumber = String(targetDate.getDate()).padStart(2, '0');
                const monthNumber = String(targetDate.getMonth() + 1).padStart(2, '0');
                const dateStr = targetDate.toLocaleDateString('en-CA', { timeZone: 'America/New_York' });

                let label = `${dayName} ${dayNumber}/${monthNumber}`;
                if (i === -1) label = `Yè (${dayName} ${dayNumber}/${monthNumber})`;
                else if (i === 0) label = `Jodi a (${dayName} ${dayNumber}/${monthNumber})`;
                else if (i === 1) label = `Demen (${dayName} ${dayNumber}/${monthNumber})`;

                if (i === 0 && !savedDate) {
                    currentDayFilter = dateStr;
                    document.getElementById('selectedDateLabel').innerText = label;
                }

                htmlContent += `
                    <button onclick="selectDate('${dateStr}', '${label}')" class="w-full text-left px-3 py-2 rounded-lg text-xs font-bold hover:bg-emerald-500/10 hover:text-emerald-400 transition">
                        ${label}
                    </button>
                `;
            }

            if (savedDate && savedDateLabel) {
                document.getElementById('selectedDateLabel').innerText = savedDateLabel;
            }

            const savedLeagueLabel = sessionStorage.getItem('bz_selected_league_label');
            if (savedLeagueLabel) {
                document.getElementById('selectedLeagueLabel').innerText = savedLeagueLabel;
            }

            dateModalList.innerHTML = htmlContent;
        }

        function selectLeague(code, name) {
            currentLeagueFilter = code;
            sessionStorage.setItem('bz_selected_league', code);
            sessionStorage.setItem('bz_selected_league_label', name);
            document.getElementById('selectedLeagueLabel').innerText = name;
            document.getElementById('leagueDropdown').classList.add('hidden');
            applyFilters();
        }

        function selectDate(dateStr, label) {
            currentDayFilter = dateStr;
            sessionStorage.setItem('bz_selected_date', dateStr);
            sessionStorage.setItem('bz_selected_date_label', label);
            document.getElementById('selectedDateLabel').innerText = label;
            document.getElementById('dateDropdown').classList.add('hidden');
            applyFilters();
        }

        function applyFilters() {
            let filtered = loadedMatches;
            if (currentDayFilter) {
                filtered = filtered.filter(m => m.matchDate === currentDayFilter);
            }
            if (currentLeagueFilter !== 'ALL') {
                filtered = filtered.filter(m => m.leagueCode === currentLeagueFilter);
            }
            renderMatches(currentUserPlan, filtered);
        }

        async function fetchLiveMatches() {
            const container = document.getElementById('matchesContainer');
            try {
                const { data: matches, error } = await supabaseClient
                    .from('daily_matches')
                    .select('*');

                if (error) throw error;

                if (matches && matches.length > 0) {
                    const todayStr = new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });

                    loadedMatches = matches.map(m => ({
                        id: m.id,
                        leagueCode: m.league_code,
                        league: m.league_name,
                        matchDate: m.match_date || todayStr,
                        time: m.match_time,
                        teamA: m.team_a,
                        teamB: m.team_b,
                        victory: m.victory,
                        percent: m.percent,
                        analysis: m.analysis
                    }));

                    applyFilters();
                } else {
                    container.innerHTML = `<div class="col-span-full text-center py-10 text-gray-400 text-xs font-bold">Pa gen match pou chanpyona sa nan date sa</div>`;
                }
            } catch (err) {
                console.error("Erè Supabase:", err);
                container.innerHTML = `<div class="col-span-full text-center py-10 text-red-400 text-xs font-bold">Erè nan chajman match yo depi Supabase.</div>`;
            }
        }

        function renderMatches(plan, list) {
            const container = document.getElementById('matchesContainer');
            const isUserFree = (plan === 'free');
            const todayStr = new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });

            if (!list || list.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-10 text-gray-400 text-xs font-bold">Pa gen match pou chanpyona sa nan date sa</div>`;
                return;
            }

            // Tcheke si dat k ap gade a se jodi a
            const isSelectedToday = (currentDayFilter === todayStr || !currentDayFilter);

            // Kalkil kantite match gratis yo
            const totalCount = list.length;
            let freeCount = 0;
            if (totalCount === 1) freeCount = 0;
            else if (totalCount <= 3) freeCount = 1;
            else if (totalCount <= 5) freeCount = 2;
            else freeCount = 3;

            // Match gratis yo vizib sèlman si se jodi a
            const freeList = isSelectedToday ? list.slice(0, freeCount) : [];
            const freeIds = new Set(freeList.map(m => m.id));

            let displayList = [];
            let isBlurredList = false;
            let canClickDetails = !isUserFree;

            if (activeCategory === 'free') {
                if (!isSelectedToday || freeList.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full text-center py-12 px-4 rounded-xl bg-brand-card/50 border border-brand-border">
                            <i class="fa-solid fa-calendar-xmark text-3xl text-emerald-400/50 mb-3 block"></i>
                            <p class="text-sm font-extrabold text-white">Match gratis jodia poko disponib</p>
                            <p class="text-xs text-gray-400 mt-1">Gade match VIP / ELITE yo oswa retounen sou dat jodi a.</p>
                        </div>
                    `;
                    return;
                }

                displayList = freeList;
                isBlurredList = false;
            } else {
                // SEKSYON VIP / ELITE
                if (isUserFree) {
                    if (isSelectedToday && freeList.length > 0) {
                        displayList = list.filter(m => !freeIds.has(m.id));
                    } else {
                        displayList = list;
                    }

                    isBlurredList = true;
                    canClickDetails = false;
                } else {
                    // Moun ki gen VIP/ELITE wè tout match yo nòmalman
                    displayList = list;
                    isBlurredList = false;
                    canClickDetails = true;
                }
            }

            if (displayList.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-10 text-gray-400 text-xs font-bold">Pa gen match nan seksyon sa a.</div>`;
                return;
            }

            container.innerHTML = displayList.map(m => {
                let cardClickAttr = '';
                if (canClickDetails) {
                    cardClickAttr = `onclick="window.location.href='details.html?id=${m.id}'"`;
                }

                return `
                    <div ${cardClickAttr} 
                         class="relative p-4 rounded-xl bg-brand-card border border-brand-border ${canClickDetails ? 'hover:border-emerald-500/40 cursor-pointer group' : ''} transition shadow-md flex flex-col justify-between overflow-hidden">
                        
                        <div>
                            <!-- HEAD: ORÈ + CHANPYONA (TOUJOU VIZIB) -->
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs text-gray-400 font-semibold flex items-center gap-1.5">
                                    <i class="fa-regular fa-clock text-emerald-400"></i> ${m.time}
                                </span>
                                <span class="text-xs text-gray-400 font-medium truncate max-w-[130px]">${m.league}</span>
                            </div>
                            
                            <!-- MATCH TEAMS (TOUJOU VIZIB) -->
                            <div class="flex items-center justify-between text-sm font-bold text-white ${canClickDetails ? 'group-hover:text-emerald-400' : ''} transition my-3 px-1">
                                <span class="truncate max-w-[42%]">${m.teamA}</span>
                                <span class="text-[10px] text-gray-500 font-extrabold px-1">VS</span>
                                <span class="truncate max-w-[42%] text-right">${m.teamB}</span>
                            </div>

                            <!-- PRONOSTIK BAZIK AK POURCENTAGE (BLURRED SI MOUN NAN GRATIS NAN VIP) -->
                            <div class="relative mt-3 rounded-lg overflow-hidden">
                                <div class="p-2.5 bg-emerald-500/10 border border-emerald-500/20 flex justify-between items-center ${isBlurredList ? 'blur-sm select-none opacity-40' : ''}">
                                    <div class="flex flex-col">
                                        <span class="text-[9px] uppercase tracking-wider font-bold text-gray-400">Pronostik Bazik:</span>
                                        <span class="text-xs font-extrabold text-emerald-400">${m.victory || 'N/A'}</span>
                                    </div>
                                    <span class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 font-extrabold text-xs border border-emerald-500/30">
                                        ${m.percent || 'N/A'}
                                    </span>
                                </div>

                                ${isBlurredList ? `
                                    <div onclick="window.location.href='checkout.html'" class="absolute inset-0 bg-brand-card/70 backdrop-blur-[2px] flex items-center justify-center gap-2 cursor-pointer border border-amber-500/30 rounded-lg hover:bg-brand-card/90 transition px-2">
                                        <i class="fa-solid fa-lock text-amber-400 text-xs"></i>
                                        <span class="text-[11px] font-extrabold text-amber-400">Debloke ak VIP / ELITE</span>
                                    </div>
                                ` : ''}
                            </div>
                        </div>

                        <!-- FOOTER AFFICHE SELON ACCESS -->
                        <div class="mt-3 pt-2 border-t border-brand-border/40 text-center">
                            ${canClickDetails ? `
                                <span class="text-[10px] text-amber-400 font-bold flex items-center justify-center gap-1.5 drop-shadow-[0_0_8px_rgba(251,191,36,0.2)]">
                                    <i class="fa-solid fa-crown text-[9px]"></i> Appuyer pour accéder à l'analyse complet du match
                                </span>
                            ` : `
                                <span onclick="window.location.href='checkout.html'" class="text-[10px] text-amber-400/80 hover:text-amber-400 font-bold flex items-center justify-center gap-1 cursor-pointer">
                                    <i class="fa-solid fa-crown text-[9px]"></i> Klike la pou w achte yon plan VIP
                                </span>
                            `}
                        </div>

                    </div>
                `;
            }).join('');
        }

        async function checkAuth() {
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            if (error || !session) { window.location.href = "auth.html"; return; }
            const user = session.user;
            const planBadge = document.getElementById('userPlanBadge');
            const vipTabLockIcon = document.getElementById('vipTabLockIcon');

            try {
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('full_name, plan, plan_expires_at')
                    .eq('id', user.id)
                    .maybeSingle();

                let displayName = profile?.full_name || user.user_metadata?.full_name || user.email.split('@')[0];
                document.getElementById('userNameDisplay').innerText = displayName;

                const rawPlan = profile?.plan || user.user_metadata?.plan || 'free';
                let currentPlan = rawPlan.toString().toLowerCase().trim();
                const expDateVal = profile?.plan_expires_at || user.user_metadata?.plan_expires_at;
                const isExpired = expDateVal && new Date(expDateVal) < new Date();

                if (isExpired) currentPlan = 'free';
                currentUserPlan = currentPlan;

                if (currentPlan.includes('elite')) {
                    planBadge.innerHTML = `<span class="px-2.5 py-1 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-[11px] font-extrabold uppercase tracking-wider flex items-center gap-1"><i class="fa-solid fa-star text-[10px]"></i> ÉLITE</span>`;
                    if (vipTabLockIcon) vipTabLockIcon.classList.add('hidden');
                } else if (currentPlan.includes('vip')) {
                    planBadge.innerHTML = `<span class="px-2.5 py-1 rounded-xl bg-purple-500/10 border border-purple-500/30 text-purple-400 text-[11px] font-extrabold uppercase tracking-wider flex items-center gap-1"><i class="fa-solid fa-crown text-[10px]"></i> VIP</span>`;
                    if (vipTabLockIcon) vipTabLockIcon.classList.add('hidden');
                } else {
                    planBadge.innerHTML = `<span class="px-2.5 py-1 rounded-xl bg-gray-500/10 border border-brand-border text-gray-400 text-[11px] font-bold uppercase tracking-wider">GRATIS</span>`;
                    if (vipTabLockIcon) vipTabLockIcon.classList.remove('hidden');
                }

                await fetchLiveMatches();

            } catch (err) {
                fetchLiveMatches();
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = "auth.html";
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderDynamicDays();
            checkAuth();
        });
    </script>
</body>
</html>
