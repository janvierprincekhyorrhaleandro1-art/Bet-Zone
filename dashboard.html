<!DOCTYPE html>
<html lang="ht" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet Zone - Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#05070a',
                            card: '#0d1117',
                            border: '#1e293b',
                            emerald: '#10b981'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #05070a; color: #f1f5f9; }
        .glass-panel { background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(16, 185, 129, 0.2); }
        .glass-nav { background: rgba(13, 17, 23, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased pb-24">

    <!-- NAVBAR DASHBOARD -->
    <nav class="w-full px-4 sm:px-6 py-3 flex justify-between items-center border-b border-brand-border glass-panel sticky top-0 z-40">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-sm">
                <i class="fa-solid fa-crown"></i>
            </div>
            <span class="font-extrabold text-base sm:text-lg text-white tracking-wide">BET<span class="text-emerald-400">ZONE</span></span>
        </div>

        <div class="flex items-center gap-2 sm:gap-3">
            <div id="userPlanBadge" class="flex items-center">
                <span class="px-2.5 py-1 rounded-xl bg-gray-500/10 border border-brand-border text-gray-400 text-[11px] font-bold uppercase tracking-wider">
                    ...
                </span>
            </div>

            <button id="logoutBtn" class="px-3 py-1.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 hover:bg-red-500 hover:text-white transition text-xs font-bold flex items-center gap-1.5">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span class="hidden sm:inline">Dekonekte</span>
            </button>
        </div>
    </nav>

    <!-- KONTENI PRENSIPAL DASHBOARD -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-6">
        
        <!-- BYENVENI BANNER -->
        <div class="p-3.5 sm:p-4 rounded-xl bg-gradient-to-r from-emerald-950/40 via-brand-card to-brand-card border border-emerald-500/30 mb-6 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-2.5 h-8 bg-emerald-500 rounded-full hidden sm:block"></div>
                <div>
                    <h1 class="text-sm sm:text-base font-bold text-white">
                        Benvini sou Dashboard ou, <span id="userNameDisplay" class="text-emerald-400 font-extrabold">...</span>! 👋
                    </h1>
                    <p class="text-gray-400 text-[11px] sm:text-xs">Prediksyon ak analiz spòtif an tan reyèl pou jodi a.</p>
                </div>
            </div>
            <div class="px-2.5 py-1 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-[11px] font-bold whitespace-nowrap flex items-center gap-1.5">
                <i class="fa-solid fa-shield-check text-xs"></i>
                <span class="hidden xs:inline">Kont Verifye</span>
            </div>
        </div>

        <!-- 1. LIS CHANPYONA YO -->
        <div class="mb-5">
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                <i class="fa-solid fa-trophy text-emerald-400"></i>
                <span>Chanpyona Yo</span>
            </h3>
            <div id="leaguesFilter" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
                <button onclick="filterLeague('ALL', this)" class="league-btn px-3 py-1.5 rounded-lg bg-emerald-500 text-black text-xs font-extrabold whitespace-nowrap shadow-sm">Tout Chanpyona</button>
                <button onclick="filterLeague('PD', this)" class="league-btn px-3 py-1.5 rounded-lg bg-brand-card border border-brand-border text-gray-400 text-xs font-bold whitespace-nowrap transition">🇪🇸 LaLiga</button>
                <button onclick="filterLeague('PL', this)" class="league-btn px-3 py-1.5 rounded-lg bg-brand-card border border-brand-border text-gray-400 text-xs font-bold whitespace-nowrap transition">🏴 Premier League</button>
                <button onclick="filterLeague('BL1', this)" class="league-btn px-3 py-1.5 rounded-lg bg-brand-card border border-brand-border text-gray-400 text-xs font-bold whitespace-nowrap transition">🇩🇪 Bundesliga</button>
                <button onclick="filterLeague('FL1', this)" class="league-btn px-3 py-1.5 rounded-lg bg-brand-card border border-brand-border text-gray-400 text-xs font-bold whitespace-nowrap transition">🇫🇷 Ligue 1</button>
                <button onclick="filterLeague('SA', this)" class="league-btn px-3 py-1.5 rounded-lg bg-brand-card border border-brand-border text-gray-400 text-xs font-bold whitespace-nowrap transition">🇮🇹 Serie A</button>
                <button onclick="filterLeague('CL', this)" class="league-btn px-3 py-1.5 rounded-lg bg-brand-card border border-brand-border text-gray-400 text-xs font-bold whitespace-nowrap transition">🏆 Champions League</button>
            </div>
        </div>

        <!-- 2. LIS JOU YO -->
        <div class="mb-6">
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                <i class="fa-regular fa-calendar-days text-emerald-400"></i>
                <span>Seleksyon Jou</span>
            </h3>
            <div id="daysList" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1"></div>
        </div>

        <!-- KAT PREDIKSYON YO -->
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-base sm:text-lg font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-fire text-emerald-400"></i>
                <span>Match ak Prediksyon</span>
            </h2>
        </div>

        <div id="matchesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="col-span-full text-center py-12 text-gray-400">
                <i class="fa-solid fa-circle-notch fa-spin text-2xl text-emerald-400 mb-2"></i>
                <p class="text-xs font-semibold">N ap chaje match reyèl yo nan sèvè a...</p>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="py-6 text-center border-t border-brand-border text-xs text-gray-500 mb-16">
        &copy; 2026 Bet Zone. Tout dwa rezève.
    </footer>

    <!-- BOTTOM NAV -->
    <div class="fixed bottom-4 left-0 right-0 z-50 px-4 pointer-events-none">
        <nav class="max-w-xs mx-auto glass-nav border border-emerald-500/30 rounded-full px-5 py-2 flex justify-between items-center shadow-2xl shadow-emerald-950/50 pointer-events-auto">
            <a href="dashboard.html" class="flex flex-col items-center gap-0.5 text-emerald-400 font-bold transition">
                <div class="w-8 h-8 rounded-full bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-sm shadow-sm">
                    <i class="fa-solid fa-futbol"></i>
                </div>
                <span class="text-[10px]">Matchs</span>
            </a>
            <a href="historique.html" class="flex flex-col items-center gap-0.5 text-gray-400 hover:text-emerald-400 font-medium transition">
                <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </div>
                <span class="text-[10px]">Istorik</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center gap-0.5 text-gray-400 hover:text-emerald-400 font-medium transition">
                <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm">
                    <i class="fa-solid fa-user"></i>
                </div>
                <span class="text-[10px]">Profil</span>
            </a>
        </nav>
    </div>

    <!-- SCRIPT SUPABASE AK KONTWÒL PLAN -->
    <script>
        const SUPABASE_URL = 'https://uiepdartkcunumajlwwg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_OQCeY9-h1_xqOHUeMiLHcQ_uxDGmFx_';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let loadedMatches = [];
        let currentUserPlan = 'free';
        let currentDayFilter = null;
        let currentLeagueFilter = 'ALL';

        function renderDynamicDays() {
            const daysContainer = document.getElementById('daysList');
            if (!daysContainer) return;
            const daysOfWeek = ['Dim', 'Len', 'Mar', 'Mèk', 'Jej', 'Vand', 'Sam'];
            const targetToday = new Date();
            let htmlContent = '';

            for (let i = -1; i <= 8; i++) {
                const targetDate = new Date(targetToday);
                targetDate.setDate(targetToday.getDate() + i);
                const dayName = daysOfWeek[targetDate.getDay()];
                const dayNumber = targetDate.getDate();
                const monthNumber = targetDate.getMonth() + 1;
                const dateStr = targetDate.toLocaleDateString('en-CA', { timeZone: 'America/New_York' });

                let label = `${dayName} ${dayNumber}/${monthNumber}`;
                if (i === -1) label = `Yè (${dayNumber}/${monthNumber})`;
                else if (i === 0) label = `Jodi a (${dayNumber}/${monthNumber})`;
                else if (i === 1) label = `Demen (${dayNumber}/${monthNumber})`;

                if (i === 0) currentDayFilter = dateStr;

                const btnClass = (i === 0)
                    ? "day-btn px-3 py-1.5 rounded-lg bg-emerald-500 text-black text-xs font-extrabold whitespace-nowrap shadow-sm transition"
                    : "day-btn px-3 py-1.5 rounded-lg bg-brand-card border border-brand-border text-gray-400 text-xs font-bold whitespace-nowrap transition hover:text-white";

                htmlContent += `<button onclick="selectDay(this, '${dateStr}')" class="${btnClass}">${label}</button>`;
            }
            daysContainer.innerHTML = htmlContent;
        }

        function selectDay(btnElement, dateStr) {
            document.querySelectorAll('.day-btn').forEach(btn => {
                btn.className = "day-btn px-3 py-1.5 rounded-lg bg-brand-card border border-brand-border text-gray-400 text-xs font-bold whitespace-nowrap transition hover:text-white";
            });
            btnElement.className = "day-btn px-3 py-1.5 rounded-lg bg-emerald-500 text-black text-xs font-extrabold whitespace-nowrap shadow-sm transition";
            currentDayFilter = dateStr;
            applyFilters();
        }

        function filterLeague(code, btnElement) {
            document.querySelectorAll('.league-btn').forEach(btn => {
                btn.className = "league-btn px-3 py-1.5 rounded-lg bg-brand-card border border-brand-border text-gray-400 text-xs font-bold whitespace-nowrap transition";
            });
            btnElement.className = "league-btn px-3 py-1.5 rounded-lg bg-emerald-500 text-black text-xs font-extrabold whitespace-nowrap shadow-sm";
            currentLeagueFilter = code;
            applyFilters();
        }

        function applyFilters() {
            let filtered = loadedMatches;
            if (currentDayFilter) {
                filtered = filtered.filter(m => m.matchDate === currentDayFilter);
            }
            if (currentLeagueFilter !== 'ALL') {
                filtered = filtered.filter(m => m.leagueCode === currentLeagueFilter);
            }
            renderMatches(currentUserPlan, filtered);
        }

        async function fetchLiveMatches() {
            const container = document.getElementById('matchesContainer');
            try {
                const { data: matches, error } = await supabaseClient
                    .from('daily_matches')
                    .select('*');

                if (error) throw error;

                if (matches && matches.length > 0) {
                    const todayStr = new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });

                    loadedMatches = matches.map(m => ({
                        id: m.id,
                        leagueCode: m.league_code,
                        league: m.league_name,
                        matchDate: m.match_date || todayStr,
                        time: m.match_time,
                        teamA: m.team_a,
                        teamB: m.team_b,
                        victory: m.victory,
                        percent: m.percent,
                        analysis: m.analysis
                    }));

                    applyFilters();
                } else {
                    container.innerHTML = `<div class="col-span-full text-center py-10 text-gray-400 text-xs font-bold">Pa gen okenn match ki disponib nan baz de done a.</div>`;
                }
            } catch (err) {
                console.error("Erè Supabase:", err);
                container.innerHTML = `<div class="col-span-full text-center py-10 text-red-400 text-xs font-bold">Erè nan chajman match yo depi Supabase.</div>`;
            }
        }

        function renderMatches(plan, list) {
            const container = document.getElementById('matchesContainer');
            const isFree = (plan === 'free');

            if (!list || list.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-8 text-gray-500 text-xs font-bold">Pa gen match disponib pou seleksyon sa.</div>`;
                return;
            }

            container.innerHTML = list.map(m => `
                <div onclick="window.location.href='details.html?id=${m.id}'" class="p-4 rounded-2xl bg-brand-card border border-brand-border hover:border-emerald-500/40 transition cursor-pointer group shadow-sm flex flex-col justify-between">
                    
                    <div>
                        <!-- HEAD: ORÈ + CHANPYONA -->
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[11px] text-gray-400 font-semibold flex items-center gap-1">
                                <i class="fa-regular fa-clock text-emerald-400"></i> ${m.time}
                            </span>
                            <div class="flex items-center gap-2">
                                <span class="text-[11px] text-gray-400 font-medium">${m.league}</span>
                                ${isFree ? `
                                    <div class="w-6 h-6 rounded-lg bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 text-[10px]" title="Accès limité">
                                        <i class="fa-solid fa-lock"></i>
                                    </div>
                                ` : `
                                    <div class="w-6 h-6 rounded-lg bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 text-[10px]">
                                        <i class="fa-solid fa-lock-open"></i>
                                    </div>
                                `}
                            </div>
                        </div>
                        
                        <!-- MATCH TEAMS -->
                        <div class="flex items-center justify-between text-xs sm:text-sm font-bold text-white group-hover:text-emerald-400 transition my-3 px-1">
                            <span class="flex items-center gap-1.5"><i class="fa-solid fa-futbol text-emerald-400 text-[10px]"></i>${m.teamA}</span>
                            <span class="text-[10px] text-gray-600 font-extrabold px-1">VS</span>
                            <span class="flex items-center gap-1.5">${m.teamB}<i class="fa-solid fa-futbol text-emerald-400 text-[10px]"></i></span>
                        </div>

                        <!-- PRONOSTIK BAZIQ -->
                        <div class="p-2.5 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex justify-between items-center mt-2">
                            <div class="flex flex-col">
                                <span class="text-[9px] uppercase tracking-wider font-bold text-gray-400">Pronostik Baziq:</span>
                                <span class="text-xs font-extrabold text-emerald-400">${m.victory}</span>
                            </div>
                        </div>

                        <!-- ANALIZ (BLURRED SI FREE) -->
                        <div class="p-2.5 rounded-xl bg-brand-dark border border-brand-border flex justify-between items-center mt-2">
                            <div class="flex flex-col">
                                <span class="text-[9px] uppercase tracking-wider font-bold text-gray-400">Analiz Rezo:</span>
                                <span class="text-xs font-bold text-gray-300 ${isFree ? 'blur-sm select-none opacity-30' : ''}">${m.analysis}</span>
                            </div>
                            <span class="px-2 py-0.5 rounded-md bg-emerald-500/15 text-emerald-400 font-extrabold text-xs border border-emerald-500/30">${m.percent}</span>
                        </div>
                    </div>

                    ${isFree ? `
                        <div class="mt-3 pt-2 border-t border-brand-border/40 text-center">
                            <a href="profile.html" class="text-[10px] text-gray-400 hover:text-amber-400 transition font-medium flex items-center justify-center gap-1">
                                <i class="fa-solid fa-gem text-amber-400/80 text-[9px]"></i> Passer en VIP / ÉLITE pour débloquer l'analyse
                            </a>
                        </div>
                    ` : ''}

                </div>
            `).join('');
        }

        async function checkAuth() {
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            if (error || !session) { window.location.href = "auth.html"; return; }
            const user = session.user;
            const planBadge = document.getElementById('userPlanBadge');

            try {
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('full_name, plan, plan_expires_at')
                    .eq('id', user.id)
                    .maybeSingle();

                let displayName = profile?.full_name || user.user_metadata?.full_name || user.email.split('@')[0];
                document.getElementById('userNameDisplay').innerText = displayName;

                const rawPlan = profile?.plan || user.user_metadata?.plan || 'free';
                let currentPlan = rawPlan.toString().toLowerCase().trim();
                const expDateVal = profile?.plan_expires_at || user.user_metadata?.plan_expires_at;
                const isExpired = expDateVal && new Date(expDateVal) < new Date();

                if (isExpired) currentPlan = 'free';
                currentUserPlan = currentPlan;

                if (currentPlan.includes('elite')) {
                    planBadge.innerHTML = `<span class="px-2.5 py-1 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-[11px] font-extrabold uppercase tracking-wider flex items-center gap-1"><i class="fa-solid fa-star text-[10px]"></i> ÉLITE</span>`;
                } else if (currentPlan.includes('vip')) {
                    planBadge.innerHTML = `<span class="px-2.5 py-1 rounded-xl bg-purple-500/10 border border-purple-500/30 text-purple-400 text-[11px] font-extrabold uppercase tracking-wider flex items-center gap-1"><i class="fa-solid fa-crown text-[10px]"></i> VIP</span>`;
                } else {
                    planBadge.innerHTML = `<span class="px-2.5 py-1 rounded-xl bg-gray-500/10 border border-brand-border text-gray-400 text-[11px] font-extrabold uppercase tracking-wider">GRATIS</span>`;
                }

                await fetchLiveMatches();

            } catch (err) {
                fetchLiveMatches();
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = "auth.html";
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderDynamicDays();
            checkAuth();
        });
    </script>
</body>
</html>
