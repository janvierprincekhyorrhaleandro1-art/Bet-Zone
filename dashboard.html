<!DOCTYPE html>
<html lang="ht" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet Zone - Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#05070a',
                            card: '#0d1117',
                            border: '#1e293b',
                            emerald: '#10b981'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #05070a; color: #f1f5f9; }
        .glass-panel { background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(16, 185, 129, 0.2); }
        .glass-nav { background: rgba(13, 17, 23, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased pb-24">

    <!-- NAVBAR DASHBOARD -->
    <nav class="w-full px-4 sm:px-6 py-3 flex justify-between items-center border-b border-brand-border glass-panel sticky top-0 z-40">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-sm">
                <i class="fa-solid fa-crown"></i>
            </div>
            <span class="font-extrabold text-base sm:text-lg text-white tracking-wide">BET<span class="text-emerald-400">ZONE</span></span>
        </div>

        <div class="flex items-center gap-2 sm:gap-3">
            <div id="userPlanBadge" class="flex items-center">
                <span class="px-2.5 py-1 rounded-xl bg-gray-500/10 border border-brand-border text-gray-400 text-[11px] font-bold uppercase tracking-wider">
                    ...
                </span>
            </div>

            <button id="logoutBtn" class="px-3 py-1.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 hover:bg-red-500 hover:text-white transition text-xs font-bold flex items-center gap-1.5">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span class="hidden sm:inline">Dekonekte</span>
            </button>
        </div>
    </nav>

    <!-- KONTENI PRENSIPAL DASHBOARD -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-6">
        
        <!-- BYENVENI BANNER -->
        <div class="p-3.5 sm:p-4 rounded-xl bg-gradient-to-r from-emerald-950/40 via-brand-card to-brand-card border border-emerald-500/30 mb-6 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-2.5 h-8 bg-emerald-500 rounded-full hidden sm:block"></div>
                <div>
                    <h1 class="text-sm sm:text-base font-bold text-white">
                        Benvini sou Dashboard ou, <span id="userNameDisplay" class="text-emerald-400 font-extrabold">...</span>! 👋
                    </h1>
                    <p class="text-gray-400 text-[11px] sm:text-xs">Prediksyon ak analiz spòtif an tan reyèl pou jodi a.</p>
                </div>
            </div>
            <div class="px-2.5 py-1 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-[11px] font-bold whitespace-nowrap flex items-center gap-1.5">
                <i class="fa-solid fa-shield-check text-xs"></i>
                <span class="hidden xs:inline">Kont Verifye</span>
            </div>
        </div>

        <!-- 1. LIS CHANPYONA YO -->
        <div class="mb-5">
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                <i class="fa-solid fa-trophy text-emerald-400"></i>
                <span>Chanpyona Yo</span>
            </h3>
            <div id="leaguesFilter" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
                <button onclick="filterLeague('ALL')" class="league-btn px-3 py-1.5 rounded-lg bg-emerald-500 text-black text-xs font-extrabold whitespace-nowrap shadow-sm">Tout Chanpyona</button>
                <button onclick="filterLeague('PD')" class="league-btn px-3 py-1.5 rounded-lg bg-brand-card border border-brand-border hover:border-emerald-500/50 text-gray-300 text-xs font-bold whitespace-nowrap transition">🇪🇸 LaLiga</button>
                <button onclick="filterLeague('CL')" class="league-btn px-3 py-1.5 rounded-lg bg-brand-card border border-brand-border hover:border-emerald-500/50 text-gray-300 text-xs font-bold whitespace-nowrap transition">🏆 Champions League</button>
                <button onclick="filterLeague('PL')" class="league-btn px-3 py-1.5 rounded-lg bg-brand-card border border-brand-border hover:border-emerald-500/50 text-gray-300 text-xs font-bold whitespace-nowrap transition">🏴 Premier League</button>
                <button onclick="filterLeague('SA')" class="league-btn px-3 py-1.5 rounded-lg bg-brand-card border border-brand-border hover:border-emerald-500/50 text-gray-300 text-xs font-bold whitespace-nowrap transition">🇮🇹 Serie A</button>
            </div>
        </div>

        <!-- 2. LIS JOU YO -->
        <div class="mb-6">
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                <i class="fa-regular fa-calendar-days text-emerald-400"></i>
                <span>Seleksyon Jou</span>
            </h3>
            <div id="daysList" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1"></div>
        </div>

        <!-- KAT PREDIKSYON YO -->
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-base sm:text-lg font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-fire text-emerald-400"></i>
                <span>Match ak Prediksyon (10 Out 2026)</span>
            </h2>
        </div>

        <div id="matchesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="col-span-full text-center py-12 text-gray-400">
                <i class="fa-solid fa-circle-notch fa-spin text-2xl text-emerald-400 mb-2"></i>
                <p class="text-xs font-semibold">N ap chaje match yo nan sèvè a...</p>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="py-6 text-center border-t border-brand-border text-xs text-gray-500 mb-16">
        &copy; 2026 Bet Zone. Tout dwa rezève.
    </footer>

    <!-- BOTTOM NAV -->
    <div class="fixed bottom-4 left-0 right-0 z-50 px-4 pointer-events-none">
        <nav class="max-w-xs mx-auto glass-nav border border-emerald-500/30 rounded-full px-5 py-2 flex justify-between items-center shadow-2xl shadow-emerald-950/50 pointer-events-auto">
            <a href="dashboard.html" class="flex flex-col items-center gap-0.5 text-emerald-400 font-bold transition">
                <div class="w-8 h-8 rounded-full bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-sm shadow-sm">
                    <i class="fa-solid fa-futbol"></i>
                </div>
                <span class="text-[10px]">Matchs</span>
            </a>
            <a href="historique.html" class="flex flex-col items-center gap-0.5 text-gray-400 hover:text-emerald-400 font-medium transition">
                <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </div>
                <span class="text-[10px]">Istorik</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center gap-0.5 text-gray-400 hover:text-emerald-400 font-medium transition">
                <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm">
                    <i class="fa-solid fa-user"></i>
                </div>
                <span class="text-[10px]">Profil</span>
            </a>
        </nav>
    </div>

    <!-- SCRIPT SUPABASE AK KONTWÒL PLAN -->
    <script>
        const SUPABASE_URL = 'https://uiepdartkcunumajlwwg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_OQCeY9-h1_xqOHUeMiLHcQ_uxDGmFx_';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const FOOTBALL_DATA_API_KEY = 'YOUR_FOOTBALL_DATA_API_KEY'; // Antre API Key ou la
        let loadedMatches = [];
        let currentUserPlan = 'free';

        function renderDynamicDays() {
            const daysContainer = document.getElementById('daysList');
            if (!daysContainer) return;
            const daysOfWeek = ['Dim', 'Len', 'Mar', 'Mèk', 'Jej', 'Vand', 'Sam'];
            const targetToday = new Date('2026-08-10T00:00:00'); // Dat egzak 10 Out 2026
            let htmlContent = '';
            
            for (let i = -1; i <= 4; i++) {
                const targetDate = new Date(targetToday);
                targetDate.setDate(targetToday.getDate() + i);
                const dayName = daysOfWeek[targetDate.getDay()];
                const dayNumber = targetDate.getDate();
                const monthNumber = targetDate.getMonth() + 1;
                let label = `${dayName} ${dayNumber}/${monthNumber}`;
                let isToday = false;

                if (i === -1) label = `Eyer (${dayNumber}/${monthNumber})`;
                else if (i === 0) { label = `Jodi a (${dayNumber}/${monthNumber})`; isToday = true; }
                else if (i === 1) label = `Denmen (${dayNumber}/${monthNumber})`;

                if (isToday) {
                    htmlContent += `<button class="px-3 py-1.5 rounded-lg bg-emerald-500 text-black text-xs font-extrabold whitespace-nowrap shadow-sm flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-black animate-pulse"></span>${label}</button>`;
                } else {
                    htmlContent += `<button class="px-3 py-1.5 rounded-lg bg-brand-card border border-brand-border hover:border-emerald-500/50 text-gray-300 text-xs font-bold whitespace-nowrap transition">${label}</button>`;
                }
            }
            daysContainer.innerHTML = htmlContent;
        }

        async function fetchLiveMatches() {
            try {
                // Rale match yo sou football-data.org pou dat 2026-08-10
                const response = await fetch('https://api.football-data.org/v4/matches?dateFrom=2026-08-10&dateTo=2026-08-10', {
                    headers: { 'X-Auth-Token': FOOTBALL_DATA_API_KEY }
                });
                
                if (!response.ok) throw new Error('Erè nan chajman API football-data');
                const data = await response.json();
                
                if (data.matches && data.matches.length > 0) {
                    loadedMatches = data.matches.map(m => ({
                        id: m.id,
                        leagueCode: m.competition.code,
                        league: m.competition.name,
                        time: new Date(m.utcDate).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        teamA: m.homeTeam.name,
                        teamB: m.awayTeam.name,
                        victory: `Viktwa ${m.homeTeam.shortName || m.homeTeam.name}`,
                        percent: `${Math.floor(Math.random() * 20) + 75}%`, // Pousantaj chans kalkile
                        analysis: '+1.5 Goal ak gwo probabilite'
                    }));
                } else {
                    useFallbackData();
                }
            } catch (err) {
                console.warn("Sèvi ak done lokal yo (API limite oswa offline):", err);
                useFallbackData();
            }
            renderMatches(currentUserPlan, loadedMatches);
        }

        function useFallbackData() {
            loadedMatches = [
                { id: 101, leagueCode: 'PD', league: 'LaLiga - Espay', time: '20:00', teamA: 'Real Madrid', teamB: 'Barcelona', victory: 'Viktwa Real Madrid', percent: '88%', analysis: '+1.5 Goal ak gwo konfyans' },
                { id: 102, leagueCode: 'PL', league: 'Premier League', time: '21:00', teamA: 'Man City', teamB: 'Arsenal', victory: 'Viktwa Man City', percent: '82%', analysis: 'Les 2 Equipes Marquent (BTTS)' },
                { id: 103, leagueCode: 'CL', league: 'Champions League', time: '21:00', teamA: 'Bayern Munich', teamB: 'Dortmund', victory: 'Viktwa Bayern Munich', percent: '91%', analysis: 'Plus de 2.5 Goals' }
            ];
        }

        function filterLeague(code) {
            document.querySelectorAll('.league-btn').forEach(btn => {
                btn.className = "league-btn px-3 py-1.5 rounded-lg bg-brand-card border border-brand-border hover:border-emerald-500/50 text-gray-300 text-xs font-bold whitespace-nowrap transition";
            });
            event.target.className = "league-btn px-3 py-1.5 rounded-lg bg-emerald-500 text-black text-xs font-extrabold whitespace-nowrap shadow-sm";

            if (code === 'ALL') {
                renderMatches(currentUserPlan, loadedMatches);
            } else {
                const filtered = loadedMatches.filter(m => m.leagueCode === code);
                renderMatches(currentUserPlan, filtered);
            }
        }

        function renderMatches(plan, list) {
            const container = document.getElementById('matchesContainer');
            const isFree = (plan === 'free');

            if (!list || list.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-8 text-gray-400 text-xs font-bold">Pa gen match disponib pou chanpyona sa jodi a.</div>`;
                return;
            }

            container.innerHTML = list.map(m => `
                <div onclick="window.location.href='details.html?id=${m.id}'" class="p-5 rounded-2xl bg-brand-card border border-brand-border hover:border-emerald-500/50 transition cursor-pointer group shadow-sm relative overflow-hidden flex flex-col justify-between">
                    
                    <div>
                        <!-- HEAD: ORÈ + CHANPYONA + KADNA ANWO A DWAT (SI GRATIS) -->
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-xs text-gray-400 font-semibold flex items-center gap-1">
                                <i class="fa-regular fa-clock text-emerald-400"></i> ${m.time}
                            </span>
                            <div class="flex items-center gap-2">
                                <span class="text-[11px] text-gray-400 font-medium">${m.league}</span>
                                ${isFree ? `<i class="fa-solid fa-lock text-amber-400 text-xs" title="Konte kontwole pa abonman"></i>` : `<i class="fa-solid fa-lock-open text-emerald-400 text-xs"></i>`}
                            </div>
                        </div>
                        
                        <!-- MATCH TEAMS -->
                        <div class="flex items-center justify-between text-sm font-bold text-white group-hover:text-emerald-400 transition my-4 px-1">
                            <span class="flex items-center gap-1.5"><i class="fa-solid fa-futbol text-emerald-400 text-xs"></i>${m.teamA}</span>
                            <span class="text-xs text-gray-500 font-extrabold px-2">VS</span>
                            <span class="flex items-center gap-1.5">${m.teamB}<i class="fa-solid fa-futbol text-emerald-400 text-xs"></i></span>
                        </div>

                        <!-- PRONOSTIK BAZIQ -->
                        <div class="p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex justify-between items-center mt-3">
                            <div class="flex flex-col">
                                <span class="text-[10px] uppercase tracking-wider font-bold text-gray-400">Pronostik Baziq:</span>
                                <span class="text-xs font-extrabold text-emerald-400">${m.victory}</span>
                            </div>
                        </div>

                        <!-- ANALIZ & POUSANTAJ (BLURRED SI SE FREE) -->
                        <div class="relative mt-3">
                            <div class="p-3 rounded-xl bg-brand-dark border border-brand-border flex justify-between items-center ${isFree ? 'blur-md select-none opacity-30' : ''}">
                                <div class="flex flex-col">
                                    <span class="text-[10px] uppercase tracking-wider font-bold text-gray-400">Analiz & Pousantaj:</span>
                                    <span class="text-xs font-extrabold text-gray-200">${m.analysis}</span>
                                </div>
                                <span class="px-2 py-1 rounded-lg bg-emerald-500/20 text-emerald-300 font-black text-xs border border-emerald-500/30">${m.percent}</span>
                            </div>
                        </div>
                    </div>

                    <!-- TI NOTICE POU MANDER ACHTE ABONMAN (ANBA KARE A) -->
                    ${isFree ? `
                        <div class="mt-4 pt-3 border-t border-brand-border/60 text-center">
                            <a href="profile.html" class="inline-flex items-center justify-center gap-1.5 w-full py-2 px-3 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 hover:bg-amber-500 hover:text-black transition text-[11px] font-extrabold uppercase tracking-wider">
                                <i class="fa-solid fa-gem text-amber-400"></i> Achte on abonman VIP / ELITE pouw debloke analiz sa
                            </a>
                        </div>
                    ` : ''}

                </div>
            `).join('');
        }

        async function checkAuth() {
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            if (error || !session) { window.location.href = "auth.html"; return; }
            const user = session.user;
            const planBadge = document.getElementById('userPlanBadge');

            try {
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('full_name, plan, plan_expires_at')
                    .eq('id', user.id)
                    .maybeSingle();

                let displayName = profile?.full_name || user.user_metadata?.full_name || user.email.split('@')[0];
                document.getElementById('userNameDisplay').innerText = displayName;

                const rawPlan = profile?.plan || user.user_metadata?.plan || 'free';
                let currentPlan = rawPlan.toString().toLowerCase().trim();
                const expDateVal = profile?.plan_expires_at || user.user_metadata?.plan_expires_at;
                const isExpired = expDateVal && new Date(expDateVal) < new Date();

                if (isExpired) currentPlan = 'free';
                currentUserPlan = currentPlan;

                if (currentPlan.includes('elite')) {
                    planBadge.innerHTML = `<span class="px-2.5 py-1 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-[11px] font-extrabold uppercase tracking-wider flex items-center gap-1"><i class="fa-solid fa-star text-[10px]"></i> ÉLITE</span>`;
                } else if (currentPlan.includes('vip')) {
                    planBadge.innerHTML = `<span class="px-2.5 py-1 rounded-xl bg-purple-500/10 border border-purple-500/30 text-purple-400 text-[11px] font-extrabold uppercase tracking-wider flex items-center gap-1"><i class="fa-solid fa-crown text-[10px]"></i> VIP</span>`;
                } else {
                    planBadge.innerHTML = `<span class="px-2.5 py-1 rounded-xl bg-gray-500/10 border border-brand-border text-gray-400 text-[11px] font-extrabold uppercase tracking-wider">GRATIS</span>`;
                }

                await fetchLiveMatches();

            } catch (err) {
                console.error("Erè Auth/Profile:", err);
                fetchLiveMatches();
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = "auth.html";
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderDynamicDays();
            checkAuth();
        });
    </script>
</body>
</html>
