<!DOCTYPE html>
<html lang="ht" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet Zone - Dashboard VIP</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#05070a',
                            card: '#0d1117',
                            border: '#1e293b',
                            emerald: '#10b981',
                            emeraldDark: '#047857'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #05070a;
            color: #f1f5f9;
        }
        .glass-panel {
            background: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .emerald-glow {
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
        }
        .emerald-gradient-bg {
            background: linear-gradient(135deg, #062016 0%, #0d1117 100%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-emerald-500 selection:text-black">

    <!-- TOP HEADER -->
    <header class="sticky top-0 z-50 glass-panel border-b border-brand-border">
        <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
            <!-- Logo ak Kouròn Vèt jan l te ye nan paj akèy la -->
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-extrabold text-base">
                    <i class="fa-solid fa-crown"></i>
                </div>
                <span class="font-extrabold text-sm sm:text-base tracking-wide text-white">
                    BET<span class="text-emerald-400">ZONE</span>
                </span>
            </div>

            <!-- Dwa: Bouton Istorik ak Profil -->
            <div class="flex items-center gap-2">
                <!-- Bouton Istorik nan Header -->
                <a href="history.html" class="px-3 py-1.5 rounded-lg bg-slate-900 border border-brand-border text-xs font-bold text-gray-300 hover:text-emerald-400 hover:border-emerald-500/40 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-clock-rotate-left text-emerald-400"></i>
                    <span>Istorik</span>
                </a>

                <!-- Profil VIP Badge -->
                <div class="flex items-center gap-2 pl-1 border-l border-brand-border">
                    <span class="px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-400 font-extrabold text-[10px] border border-emerald-500/30">
                        VIP
                    </span>
                    <div class="w-7 h-7 rounded-full bg-slate-800 border border-brand-border flex items-center justify-center text-xs font-bold text-gray-300">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <div class="max-w-4xl mx-auto px-4 py-5 w-full flex-grow space-y-4">

        <!-- TIT LIS MATCH YO -->
        <div class="flex justify-between items-center pt-2">
            <h2 class="text-xs sm:text-sm font-bold text-gray-300 uppercase tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-bolt text-emerald-400"></i>
                <span>Match & Tips Disponib</span>
            </h2>

            <a href="history.html" class="text-xs text-emerald-400 font-bold hover:underline flex items-center gap-1">
                <span>Gade Istorik</span>
                <i class="fa-solid fa-chevron-right text-[10px]"></i>
            </a>
        </div>

        <!-- LIS KAD MATCH YO -->
        <div class="space-y-3">

            <!-- MATCH CARD 1 -->
            <a href="match-details.html" class="block p-4 rounded-2xl bg-brand-card border border-brand-border hover:border-emerald-500/50 transition group">
                <div class="flex justify-between items-center text-[10px] text-gray-400 pb-2 border-b border-brand-border/60">
                    <span class="font-bold text-emerald-400 flex items-center gap-1">
                        <i class="fa-solid fa-trophy"></i> UEFA Champions League
                    </span>
                    <span class="bg-black/60 px-2 py-0.5 rounded text-gray-300 font-mono">Jodi a • 20:00</span>
                </div>

                <div class="flex justify-between items-center my-3 px-1">
                    <div class="text-center w-1/3">
                        <span class="text-xs sm:text-sm font-bold text-white group-hover:text-emerald-400 transition">Real Madrid</span>
                    </div>
                    <div class="text-center">
                        <span class="px-2 py-0.5 rounded bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 font-bold text-[10px]">VS</span>
                    </div>
                    <div class="text-center w-1/3">
                        <span class="text-xs sm:text-sm font-bold text-white group-hover:text-emerald-400 transition">Man City</span>
                    </div>
                </div>

                <div class="p-2.5 rounded-xl emerald-gradient-bg border border-emerald-500/30 flex justify-between items-center">
                    <div>
                        <span class="text-[9px] font-bold text-emerald-400 uppercase tracking-wider block">Tip IA:</span>
                        <span class="text-xs font-extrabold text-white">2 Ekip Ap Sipòte Bi (BTTS)</span>
                    </div>
                    <div class="text-right">
                        <span class="text-[9px] text-gray-400 block">Konfyans</span>
                        <span class="px-2 py-0.5 rounded bg-emerald-500 text-black font-extrabold text-[10px]">88%</span>
                    </div>
                </div>
            </a>

            <!-- MATCH CARD 2 -->
            <a href="match-details.html" class="block p-4 rounded-2xl bg-brand-card border border-brand-border hover:border-emerald-500/50 transition group">
                <div class="flex justify-between items-center text-[10px] text-gray-400 pb-2 border-b border-brand-border/60">
                    <span class="font-bold text-emerald-400 flex items-center gap-1">
                        <i class="fa-solid fa-trophy"></i> Premier League
                    </span>
                    <span class="bg-black/60 px-2 py-0.5 rounded text-gray-300 font-mono">Jodi a • 16:00</span>
                </div>

                <div class="flex justify-between items-center my-3 px-1">
                    <div class="text-center w-1/3">
                        <span class="text-xs sm:text-sm font-bold text-white group-hover:text-emerald-400 transition">Arsenal</span>
                    </div>
                    <div class="text-center">
                        <span class="px-2 py-0.5 rounded bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 font-bold text-[10px]">VS</span>
                    </div>
                    <div class="text-center w-1/3">
                        <span class="text-xs sm:text-sm font-bold text-white group-hover:text-emerald-400 transition">Chelsea</span>
                    </div>
                </div>

                <div class="p-2.5 rounded-xl emerald-gradient-bg border border-emerald-500/30 flex justify-between items-center">
                    <div>
                        <span class="text-[9px] font-bold text-emerald-400 uppercase tracking-wider block">Tip IA:</span>
                        <span class="text-xs font-extrabold text-white">Victoire Arsenal (1)</span>
                    </div>
                    <div class="text-right">
                        <span class="text-[9px] text-gray-400 block">Konfyans</span>
                        <span class="px-2 py-0.5 rounded bg-emerald-500 text-black font-extrabold text-[10px]">82%</span>
                    </div>
                </div>
            </a>

        </div>

    </div>

    <!-- FOOTER -->
    <footer class="border-t border-brand-border bg-black py-4 text-center text-[11px] text-gray-500 mt-auto">
        <p>© 2026 Bet Zone - Tout dwa rezève.</p>
    </footer>

</body>
</html>
