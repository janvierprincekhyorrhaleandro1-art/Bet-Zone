<!DOCTYPE html>
<html lang="ht" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet Zone - Detay Match</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#05070a',
                            card: '#0d1117',
                            border: '#1e293b',
                            emerald: '#10b981'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #05070a; color: #f1f5f9; }
        .glass-panel { background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(16, 185, 129, 0.2); }
        .glass-nav { background: rgba(13, 17, 23, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .tab-btn.active {
            color: #10b981;
            border-bottom-color: #10b981;
            background-color: rgba(16, 185, 129, 0.05);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased pb-24">

    <!-- NAVBAR -->
    <nav class="w-full px-4 sm:px-6 py-3 flex justify-between items-center border-b border-brand-border glass-panel sticky top-0 z-40">
        <div class="flex items-center gap-2.5">
            <a href="dashboard.html" class="w-8 h-8 rounded-xl bg-brand-card border border-brand-border flex items-center justify-center text-gray-400 hover:text-white transition">
                <i class="fa-solid fa-arrow-left text-xs"></i>
            </a>
            <span class="font-extrabold text-base sm:text-lg text-white tracking-wide">BET<span class="text-emerald-400">ZONE</span></span>
        </div>

        <div class="flex items-center gap-2">
            <span id="userPlanTag" class="px-2.5 py-1 rounded-xl text-[10px] font-extrabold uppercase tracking-wider bg-gray-800 text-gray-400">...</span>
        </div>
    </nav>

    <!-- KONTENI PRENSIPAL -->
    <main class="flex-grow max-w-3xl w-full mx-auto px-4 py-6 space-y-6">

        <div class="flex justify-between items-center text-xs">
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="font-bold text-gray-300 uppercase tracking-wider mono">UEFA Champions League</span>
            </div>
            <span class="px-2.5 py-1 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 font-bold text-[10px] uppercase mono">Annatant (21:00)</span>
        </div>

        <!-- SCOREBOARD CARD -->
        <div class="p-6 rounded-3xl bg-brand-card border border-brand-border relative overflow-hidden">
            <div class="flex items-center justify-between gap-4">
                <div class="flex-1 flex flex-col items-center text-center">
                    <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl bg-brand-dark border border-brand-border p-3 flex items-center justify-center mb-2 shadow-inner">
                        <img id="homeLogo" src="https://media.api-sports.io/football/teams/541.png" alt="Home Team" class="w-full h-full object-contain">
                    </div>
                    <h2 id="homeTeamName" class="text-sm sm:text-base font-extrabold text-white">Real Madrid</h2>
                </div>

                <div class="flex flex-col items-center justify-center shrink-0">
                    <span class="text-2xl sm:text-3xl font-black text-emerald-400 mono tracking-widest">VS</span>
                </div>

                <div class="flex-1 flex flex-col items-center text-center">
                    <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl bg-brand-dark border border-brand-border p-3 flex items-center justify-center mb-2 shadow-inner">
                        <img id="awayLogo" src="https://media.api-sports.io/football/teams/50.png" alt="Away Team" class="w-full h-full object-contain">
                    </div>
                    <h2 id="awayTeamName" class="text-sm sm:text-base font-extrabold text-white">Man City</h2>
                </div>
            </div>
        </div>

        <!-- TABS -->
        <div class="flex border-b border-brand-border overflow-x-auto no-scrollbar gap-2 bg-brand-card/50 p-1 rounded-2xl">
            <button onclick="switchTab('tab-pronostik')" id="btn-tab-pronostik" class="tab-btn active flex-1 py-2.5 px-4 text-xs font-bold text-gray-400 border-b-2 border-transparent transition whitespace-nowrap text-center rounded-xl">
                <i class="fa-solid fa-bullseye mr-1.5"></i>Pronostik Ofisyèl
            </button>
            <button onclick="switchTab('tab-analiz')" id="btn-tab-analiz" class="tab-btn flex-1 py-2.5 px-4 text-xs font-bold text-gray-400 border-b-2 border-transparent transition whitespace-nowrap text-center rounded-xl">
                <i class="fa-solid fa-robot mr-1.5"></i>Analiz Match (IA)
            </button>
            <button onclick="switchTab('tab-aktyalite')" id="btn-tab-aktyalite" class="tab-btn flex-1 py-2.5 px-4 text-xs font-bold text-gray-400 border-b-2 border-transparent transition whitespace-nowrap text-center rounded-xl">
                <i class="fa-solid fa-newspaper mr-1.5"></i>Jwè Absan & Lineup
            </button>
        </div>

        <!-- TAB CONTENT -->
        <div id="tab-content">

            <!-- PRONOSTIK -->
            <div id="tab-pronostik" class="tab-pane space-y-4">
                <div class="p-5 rounded-3xl bg-brand-card border border-brand-border">
                    <h3 class="text-xs font-extrabold text-white uppercase tracking-wider mb-4 mono">// PRONOSTIK DETAYE</h3>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-brand-dark text-gray-400 uppercase font-mono text-[10px]">
                                <tr>
                                    <th class="p-3">Opsyon</th>
                                    <th class="p-3">Konfyans (%)</th>
                                    <th class="p-3">Ris</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-brand-border text-gray-200">
                                <!-- Dinamikman ranpli pa Javascript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- ANALIZ IA -->
            <div id="tab-analiz" class="tab-pane hidden space-y-4">
                <div class="p-5 rounded-3xl bg-brand-card border border-brand-border relative">
                    <h3 class="text-xs font-extrabold text-white uppercase tracking-wider mb-3 mono flex items-center gap-2">
                        <i class="fa-solid fa-brain text-emerald-400"></i>
                        <span>Analiz Entelijans Atifisyèl (IA)</span>
                    </h3>
                    <p class="text-xs sm:text-sm text-gray-300 leading-relaxed">
                        <!-- Dinamikman ranpli pa Javascript -->
                    </p>
                </div>

                <!-- BILAN AK FORME -->
                <div class="grid grid-cols-2 gap-3 text-xs">
                    <div class="p-4 rounded-2xl bg-brand-card border border-brand-border space-y-2"></div>
                    <div class="p-4 rounded-2xl bg-brand-card border border-brand-border space-y-2"></div>
                </div>

                <div class="p-4 rounded-2xl bg-brand-card border border-brand-border space-y-3">
                    <div class="flex items-center justify-between"></div>
                    <div class="flex items-center justify-between"></div>
                </div>

                <!-- H2H -->
                <div class="p-4 rounded-2xl bg-brand-card border border-brand-border">
                    <h4 class="text-xs font-bold text-gray-400 mb-3 uppercase tracking-wider mono">Dènye Konfrontasyon (H2H)</h4>
                    <div class="space-y-2"></div>
                </div>
            </div>

            <!-- AKTYALITE / ABSAN -->
            <div id="tab-aktyalite" class="tab-pane hidden space-y-4">
                <div class="p-5 rounded-3xl bg-brand-card border border-brand-border">
                    <h3 class="text-xs font-extrabold text-white uppercase tracking-wider mb-3 mono flex items-center gap-2">
                        <i class="fa-solid fa-user-xmark text-red-400"></i>
                        <span>Jwè ki Absan (Blesi / Sanksyon)</span>
                    </h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                        <div class="p-3 rounded-2xl bg-brand-dark border border-brand-border space-y-1"></div>
                        <div class="p-3 rounded-2xl bg-brand-dark border border-brand-border space-y-1"></div>
                    </div>
                </div>

                <div class="p-5 rounded-3xl bg-brand-card border border-brand-border space-y-4">
                    <h3 class="text-xs font-extrabold text-white uppercase tracking-wider mono flex items-center gap-2">
                        <i class="fa-solid fa-shirt text-emerald-400"></i>
                        <span>11 PWOBAB</span>
                    </h3>
                    <p class="text-[11px] text-gray-400 italic"></p>

                    <!-- TEREN FOUTBÒL VISYÈL -->
                    <div class="relative w-full h-80 rounded-2xl bg-emerald-950/40 border border-emerald-500/30 overflow-hidden flex flex-col justify-between p-3">
                        <div id="homeTeamPitch" class="h-1/2 flex flex-col justify-around"></div>
                        <div class="w-full border-b border-dashed border-emerald-500/30 my-1"></div>
                        <div id="awayTeamPitch" class="h-1/2 flex flex-col justify-around"></div>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- SCRIPT PRENSIPAL -->
    <script>
        const SUPABASE_URL = 'https://uiepdartkcunumajlwwg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_OQCeY9-h1_xqOHUeMiLHcQ_uxDGmFx_';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const BACKEND_URL = 'https://bet-zone.onrender.com';

        function switchTab(tabId) {
            document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById('btn-' + tabId).classList.add('active');
        }

        function riskColor(risk){
            if(risk === 'Elve') return 'bg-red-500/10 text-red-400 border-red-500/20';
            if(risk === 'Modere') return 'bg-amber-500/10 text-amber-400 border-amber-500/20';
            return 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
        }
        function formResultColor(r){
            if(r === 'W') return 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';
            if(r === 'L') return 'bg-red-500/20 text-red-400 border-red-500/30';
            return 'bg-amber-500/20 text-amber-400 border-amber-500/30';
        }

        async function loadMatchHeader(matchId) {
    const { data: m, error } = await supabaseClient.from('daily_matches').select('*').eq('id', matchId).single();
    if (error || !m) {
        document.querySelector('main').innerHTML = '<div class="text-center py-20 text-gray-400 text-sm">Match sa a pa jwenn.</div>';
        return null;
    }
    document.querySelector('.mono.uppercase').textContent = m.league_name;
    document.getElementById('homeTeamName').textContent = m.team_a;
    document.getElementById('awayTeamName').textContent = m.team_b;
    document.getElementById('homeLogo').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(m.team_a)}&background=10b981&color=fff`;
    document.getElementById('awayLogo').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(m.team_b)}&background=0284c7&color=fff`;

    // Estati/lè
    const statusBadge = document.querySelector('.text-amber-400.mono.uppercase');
    if (statusBadge) statusBadge.textContent = `Annatant (${m.match_time})`;

    // Dat match la (fòma: "8 Out 2026")
    const dateEl = document.querySelector('.text-gray-400.mt-1.mono');
    if (dateEl && m.match_date) {
        const moisKreyol = ['Janvye','Fevriye','Mas','Avril','Me','Jen','Jiyè','Out','Septanm','Oktòb','Novanm','Desanm'];
        const d = new Date(m.match_date + 'T00:00:00');
        dateEl.textContent = `${d.getDate()} ${moisKreyol[d.getMonth()]} ${d.getFullYear()}`;
    }

    return m;
}

        function renderPronostik(list) {
            const tbody = document.querySelector('#tab-pronostik tbody');
            tbody.innerHTML = (list || []).map(p => `
                <tr>
                    <td class="p-3 font-bold text-gray-300">${p.label}</td>
                    <td class="p-3 mono font-bold text-amber-400">${p.confidence}%</td>
                    <td class="p-3"><span class="px-2 py-0.5 text-[10px] rounded-md border font-bold ${riskColor(p.risk)}">${p.risk}</span></td>
                </tr>`).join('');
        }

        function renderAnaliz(data, homeName, awayName) {
            document.querySelector('#tab-analiz p.leading-relaxed').textContent = data.analiz_ia || '';

            const bilan = data.bilan || {};
            const bilanBoxes = document.querySelectorAll('#tab-analiz .grid.grid-cols-2 > div');
            if (bilanBoxes[0] && bilan.home) {
                bilanBoxes[0].innerHTML = `<span class="font-extrabold text-white block border-b border-brand-border pb-1">${homeName} (Lakay)</span>
                    <div class="flex justify-between text-gray-400"><span>Genyen:</span><span class="font-bold text-emerald-400">${bilan.home.win}</span></div>
                    <div class="flex justify-between text-gray-400"><span>Nul:</span><span class="font-bold text-amber-400">${bilan.home.draw}</span></div>
                    <div class="flex justify-between text-gray-400"><span>Pèdi:</span><span class="font-bold text-red-400">${bilan.home.loss}</span></div>`;
            }
            if (bilanBoxes[1] && bilan.away) {
                bilanBoxes[1].innerHTML = `<span class="font-extrabold text-white block border-b border-brand-border pb-1">${awayName} (Deyò)</span>
                    <div class="flex justify-between text-gray-400"><span>Genyen:</span><span class="font-bold text-emerald-400">${bilan.away.win}</span></div>
                    <div class="flex justify-between text-gray-400"><span>Nul:</span><span class="font-bold text-amber-400">${bilan.away.draw}</span></div>
                    <div class="flex justify-between text-gray-400"><span>Pèdi:</span><span class="font-bold text-red-400">${bilan.away.loss}</span></div>`;
            }

            const forme = data.forme || {};
            const formeBoxes = document.querySelectorAll('#tab-analiz .space-y-3 > div');
            const renderForm = (name, arr) => `<span class="font-bold text-white">${name}</span><div class="flex gap-1 mono font-bold text-[10px]">${(arr||[]).map(r => `<span class="w-5 h-5 rounded flex items-center justify-center border ${formResultColor(r)}">${r}</span>`).join('')}</div>`;
            if (formeBoxes[0]) formeBoxes[0].innerHTML = renderForm(homeName, forme.home);
            if (formeBoxes[1]) formeBoxes[1].innerHTML = renderForm(awayName, forme.away);

            const h2hContainer = document.querySelector('#tab-analiz .space-y-2');
            h2hContainer.innerHTML = (data.h2h || []).map(h => `
                <div class="flex justify-between items-center p-2 rounded-xl bg-brand-dark text-gray-300">
                    <span>${h.result}</span><span class="text-[10px] font-mono text-gray-500">${h.date}</span>
                </div>`).join('');
        }

        function renderAktyalite(data, homeName, awayName) {
            const absences = data.absences || { home: [], away: [] };
            const absBoxes = document.querySelectorAll('#tab-aktyalite .grid.grid-cols-1 > div');
            const renderAbs = (name, list, color) => `<span class="font-extrabold ${color} block">${name}</span>` +
                (list||[]).map(p => `<div class="flex items-center justify-between text-gray-300"><span>${p.name}</span><span class="text-[10px] text-red-400 font-bold">${p.status}</span></div>`).join('');
            if (absBoxes[0]) absBoxes[0].innerHTML = renderAbs(homeName, absences.home, 'text-emerald-400');
            if (absBoxes[1]) absBoxes[1].innerHTML = renderAbs(awayName, absences.away, 'text-blue-400');

            document.querySelector('#tab-aktyalite .text-\\[11px\\]').textContent = data.recommendation || '';

            if (data.lineup) {
                renderPitchLineup(data.lineup);
                const lineupTitle = document.querySelector('#tab-aktyalite h3 span');
                if (lineupTitle) lineupTitle.textContent = '11 PWOBAB (ESTIMASYON)';
            }
        }

        function renderPitchLineup(lineup) {
            const buildSide = (side) => `
                <div class="flex justify-center"><span class="bg-black/90 text-emerald-300 text-[9px] font-bold px-2 py-0.5 rounded-full border border-emerald-400/50">${side.gk?.[0] || ''}</span></div>
                <div class="flex justify-around px-2">${(side.df||[]).map(p => `<span class="bg-black/80 text-white text-[8px] font-medium px-1.5 py-0.5 rounded border border-white/20">${p}</span>`).join('')}</div>
                <div class="flex justify-around px-4">${(side.mid||[]).map(p => `<span class="bg-black/80 text-white text-[8px] font-medium px-1.5 py-0.5 rounded border border-white/20">${p}</span>`).join('')}</div>
                <div class="flex justify-around px-6">${(side.fw||[]).map(p => `<span class="bg-black/80 text-white text-[8px] font-medium px-1.5 py-0.5 rounded border border-white/20">${p}</span>`).join('')}</div>`;
            const homeEl = document.getElementById('homeTeamPitch');
            const awayEl = document.getElementById('awayTeamPitch');
            if (homeEl && lineup.home) homeEl.innerHTML = buildSide(lineup.home);
            if (awayEl && lineup.away) awayEl.innerHTML = buildSide(lineup.away);
        }

        async function loadAnalysis(matchId, homeName, awayName) {
            try {
                const res = await fetch(`${BACKEND_URL}/api/match-details/${matchId}`);
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Erè');
                renderPronostik(data.pronostik);
                renderAnaliz(data, homeName, awayName);
                renderAktyalite(data, homeName, awayName);
            } catch (err) {
                console.error('Analiz error:', err);
                document.querySelector('#tab-analiz p.leading-relaxed').textContent = 'Nou pa t ka chaje analiz la kounye a.';
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const matchId = params.get('id');
            if (!matchId) return;
            const match = await loadMatchHeader(matchId);
            if (match) loadAnalysis(matchId, match.team_a, match.team_b);
        });
    </script>
</body>
</html>
